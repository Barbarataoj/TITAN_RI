# =============================
# OUD-focused baseline scenario
# This file now represents ONLY people with OUD.
# drug_type has only Inj and NonInj (no explicit non-OUD "None" type).
# Sex with non-OUD partners will be modeled via background FOI in hiv.yml/HIV.py.
# =============================

demographics:
  black_nonhispanic:
    ppl: 0.033    # ~3% of OUD population (over-represented vs gen pop to reflect higher burden)
    sex_type:
      MTF:
        ppl: 0.1
        drug_type: &base_drug_type
          Inj:
            # CHANGED: rescaled from 0.35 of total, now 0.5 among OUD-only (Inj+NonInj=1)
            ppl: 0.50
            exit:
              death:
                base: 10.8
              migrate:
                prob: 0.001
            num_partners:
              Sex:
                dist_type: poisson
                vars:
                  1:
                    value: 10
                    value_type: float
              Social:
                dist_type: poisson
                vars:
                  1:
                    value: 0
                    value_type: float
              SexInj:
                dist_type: poisson
                vars:
                  1:
                    value: 10
                    value_type: float
              Inj:
                dist_type: poisson
                vars:
                  1:
                    value: 10
                    value_type: float
            hiv:
              init: 0.10
              dx:
                init: 0.10
                prob: 0.10
              aids:
                init: 0.10
            monkeypox:
              init: 0.10
              dx:
                init: 0.10
                prob: 0.10
            haart:
              init: 0.10
              enroll: &haart_prob
                begin:
                  prob: 0.10
                  start: 0
                  stop: 10
                end:
                  prob: 1.0
                  start: 10
                  stop: 100
              reinit: &reinit_prob
                prob: 0.0
              adherence:
                init: 0.10
                prob: 0.10
              discontinue: 0.10
            moud:
              init: 0.40       # ~40% of PWID with OUD on MOUD at baseline (RI is fairly high-coverage)
              enroll:
                early:
                  start: 0
                  stop: 6
                  prob: 0.06   # 6% per month in first 6 months among those not on MOUD
                late:
                  start: 6
                  stop: 120
                  prob: 0.015  # 1.5% per month after 6 months
              reinit:
                prob: 0.03      # chance to re-start MOUD if previously ever on it
              discontinue: 0.02      # 2% per month discontinuation
          NonInj: &npwid_drug_type
            # CHANGED: rescaled from 0.35 of total, now 0.5 among OUD-only (Inj+NonInj=1)
            ppl: 0.50
            exit:
              death:
                base: 10.8
              migrate:
                prob: 0.01
            hiv:
              init: 0.05
              dx:
                init: 0.10
                prob: 0.08
              aids:
                init: 0.05
            monkeypox:
              init: 0.05
              dx:
                init: 0.10
                prob: 0.08
            num_partners:
              Sex:
                dist_type: poisson
                vars:
                  1:
                    value: 6
                    value_type: float
            haart:
              init: 0.08
              enroll: *haart_prob
              reinit: *reinit_prob
              adherence:
                init: 0.10
                prob: 0.10
              discontinue: 0.10
            moud:
              init: 0.30       # lower baseline MOUD coverage than Inj
              enroll:
                early:
                  start: 0
                  stop: 6
                  prob: 0.04
                late:
                  start: 6
                  stop: 120
                  prob: 0.01
              reinit:
                prob: 0.02
              discontinue: 0.02

          # REMOVED: explicit non-OUD type
          # None:
          #   ppl: 0.30
          #   ...

        incar: &base_incar
          init: 0.03
          prob: 0.03
        safe_sex: &safe_sex_default
          Sex:
            prob: 0.15
          Inj:
            prob: 0.10
          SexInj:
            prob: 0.10
        injection: &base_injection
          unsafe_prob: 0.10
