partnership:
  pca:
    frequency:
      Sex: &bin_always_one
        bins:
          1:
            prob: 1.0
            min: 1
            max: 1
      SexInj: *bin_always_one
      Inj: *bin_always_one
  sex:
    frequency:
      Sex:
        type: bins
        bins:
          1:
            prob: 0.5
            min: 0
            max: 1
          2:
            prob: 1.0
            min: 37
            max: 38
    acquisition:
      HM:
        versatile: 0.0004
      HF:
        versatile: 0.0008
      MSM:
        insertive: 0.0011
        receptive: 0.0138
        versatile: 0.00745
  duration:
    Sex:
      white:
        type: bins
        bins:
          1:
            prob: 1.0
            min: 1
            max: 2
      black:
        type: bins
        bins:
          1:
            prob: 1.0
            min: 3
            max: 4
    Inj:
      white: &inj_dur
        type: distribution
        distribution:
          dist_type: randint
          vars:
            1:
              value: 1
              value_type: int
            2:
              value: 3
              value_type: int
          mean: 1
      black: *inj_dur
    SexInj:
      white: &poisson_one
        type: distribution
        distribution:
          dist_type: poisson
          vars:
            1:
              value: 1
              value_type: float
          mean: 1
      black: *poisson_one
    Social:
      white: *poisson_one
      black: *poisson_one

prep:
  cap: 0.10
  init: 0.70
  cap_as_prob: false

knowledge:
  prob: 0.30
  opinion:
    prob: 0.50

syringe_services:
  timeline:
    ssp_open:
      start_time: 1
      stop_time: 120
      num_slots_start: 100
      num_slots_stop: 200
      risk: 0.02

agent_zero:
  interaction_type: injection
  num_partners: 1

outputs:
  network:
    calc_component_stats: true
  classes:
    - locations
    - races
    - sex_types
    - components
    - drug_types

exposures:
  hiv: true
  knowledge: true
  monkeypox: true

haart:
  use_reinit: true

features:
  incar: true
  prep: true
  high_risk: true
  haart: true
  exit_enter: true
  static_network: false
  agent_zero: true
  assort_mix: false
  vaccine: true
  partner_tracing: true
  external_exposure: true
  syringe_services: true
  timeline_scaling: true
  moud: true
  hiv_testing: true
  overdose: true
  oud_state: true          # CHANGED: enable the new OUD state feature

model:
  seed:
    run: 0 # let TITAN pick a random positive seed
    ppl: 12345
  num_reps: 1   # e.g., 1000 Monte Carlo runs
  num_pop: 1000    # OUD-like population size (scaled)
  time:
    num_steps: 240       # 240 steps total → 20 years if 12 steps/year
    steps_per_year: 12   # monthly time step
    burn_steps: 120      # first 10 years = burn-in, last 10 years = calibration window
  network:
    enable: true
    type: scale_free      # or comp_size
    component_size:
      max: 100

location:
  scaling:
    world:
      demographics|white|sex_type|WSW|drug_type|NonInj|hiv|aids|init:
        field: override
        override: 1

external_exposure:
  convert_prob: 1.0

exit_enter:
  death:
    exit_class: death
    entry_class: replace

classes:
  exit:
    death:
      exit_type: death
      ignore_incar: true
    age_out:
      exit_type: age_out
      ignore_incar: false
      age: 999
    migrate:
      exit_type: drop_out
      ignore_incar: false
    none:
      exit_type: none
      ignore_incar: false
  enter:
    replace:
      enter_type: replace
      prob: 1.0
    age_in:
      enter_type: replace
      age: 16
      prob: 1.0
      age_in: true
    new_ag:
      enter_type: new_agent
      prob: 1.0
  age_bins:
    fallback_young:
      min_age: 0
      max_age: 15
    young_adult:
      min_age: 16
      max_age: 24
    mid_adult:
      min_age: 25
      max_age: 44
    fallback_old:
      min_age: 45
      max_age: 999

# ============ TOP-LEVEL MOUD / OVERDOSE / HIV TESTING PARAMS ============

moud:
  start_time: 0
  use_reinit: true
  overdose_scale:
    active: 0.4   # ~60% reduction in overdose risk when on MOUD
    inactive: 1.0
  injection_scale:
    active: 0.7   # ~30% reduction in injection HIV risk
    inactive: 1.0

overdose:
  # NOTE: base_prob_inj should probably be much lower than 0.50 for realism;
  # you can tune this during calibration.
  base_prob_inj: 0.50
  base_prob_noninj: 0.007
  fatal_frac: 0.12
  high_risk_mult: 2.0
  ssp_rr: 0.8

hiv_testing:
  base_prob: 0.30
  high_risk_mult: 2.0
  oud_mult: 1.5
  interval: 3

oud:
  transitions:
    remission_rate_per_year: 0.15
    inject_start_rate_per_year: 0.05
    inject_stop_rate_per_year: 0.20
