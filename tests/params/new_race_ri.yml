model:
  seed:
    run: 0 # let TITAN pick a random positive seed
    ppl: 12345
  num_reps: 1   # e.g., 1000 Monte Carlo runs
  num_pop: 100   # OUD-like population size (scaled)
  time:
    num_steps: 120       # 240 steps total → 20 years if 12 steps/year
    steps_per_year: 12   # monthly time step
    burn_steps: 120      # first 10 years = burn-in, last 10 years = calibration window
  network:
    enable: true
    type: scale_free      # or comp_size
    component_size:
      max: 100

  locations:
    world:
      ppl: 1.0
      category: world


external_exposure:
  convert_prob: 1.0

exit_enter:
  death:
    exit_class: death
    entry_class: replace

classes:
  exit:
    death:
      exit_type: death
      ignore_incar: true
    age_out:
      exit_type: age_out
      ignore_incar: false
      age: 999
    migrate:
      exit_type: drop_out
      ignore_incar: false
    none:
      exit_type: none
      ignore_incar: false
  enter:
    replace:
      enter_type: replace
      prob: 1.0
    age_in:
      enter_type: replace
      age: 16
      prob: 1.0
      age_in: true
    new_ag:
      enter_type: new_agent
      prob: 1.0
  age_bins:
    fallback_young:
      min_age: 0
      max_age: 15
    young_adult:
      min_age: 16
      max_age: 24
    mid_adult:
      min_age: 25
      max_age: 44
    fallback_old:
      min_age: 45
      max_age: 999

