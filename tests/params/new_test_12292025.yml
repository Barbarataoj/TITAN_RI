# =========================
# MODEL
# =========================
model:
  seed:
    run: 0
    ppl: 12345
  num_reps: 1
  num_pop: 100
  time:
    num_steps: 120
    steps_per_year: 12
    burn_steps: 120
  network:
    enable: true
    type: scale_free
    component_size:
      max: 100

# =========================
# CLASSES
# =========================
classes:
  races:
    white:
      hispanic: false
    black:
      hispanic: false

  sex_types:
    HM:
      gender: M
      cis_trans: cis
      sleeps_with: [HF]
    HF:
      gender: F
      cis_trans: cis
      sleeps_with: [HM]

  drug_types: [Inj, NonInj, None]

  bond_types:
    Inj:
      acts_allowed: [injection]
    Sex:
      acts_allowed: [sex]

  exit:
    death:
      exit_type: death
      ignore_incar: true

  enter:
    replace:
      enter_type: replace
      prob: 1.0



# =========================
# LOCATIONS
# =========================
locations:
  world:
    ppl: 1.0
    category: world

# =========================
# DEMOGRAPHICS
# =========================
demographics:
  white:
    ppl: 0.6
    age:
      adult:
        prob: 1.0
        min: 18
        max: 80
    sex_type:
      HM:
        ppl: 0.5
        drug_type:
          Inj:
            ppl: 0.3
            num_partners:
              Inj:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          NonInj:
            ppl: 0.4
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          None:
            ppl: 0.3
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 0, value_type: int}
      HF:
        ppl: 0.5
        drug_type:
          Inj:
            ppl: 0.3
            num_partners:
              Inj:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          NonInj:
            ppl: 0.4
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          None:
            ppl: 0.3
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 0, value_type: int}

  black:
    ppl: 0.4
    age:
      adult:
        prob: 1.0
        min: 18
        max: 80
    sex_type:
      HM:
        ppl: 0.5
        drug_type:
          Inj:
            ppl: 0.4
            num_partners:
              Inj:
                dist_type: set_value
                vars:
                  1: {value: 2, value_type: int}
          NonInj:
            ppl: 0.4
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          None:
            ppl: 0.2
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 0, value_type: int}
      HF:
        ppl: 0.5
        drug_type:
          Inj:
            ppl: 0.4
            num_partners:
              Inj:
                dist_type: set_value
                vars:
                  1: {value: 2, value_type: int}
          NonInj:
            ppl: 0.4
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 1, value_type: int}
          None:
            ppl: 0.2
            num_partners:
              Sex:
                dist_type: set_value
                vars:
                  1: {value: 0, value_type: int}

# =========================
# FEATURES (ONLY ENABLED ONES)
# =========================
features:
  incar: false
  prep: false
  high_risk: false
  haart: false
  exit_enter: true
  static_network: false
  agent_zero: false
  assort_mix: false
  vaccine: false
  partner_tracing: false
  external_exposure: false
  syringe_services: true
  timeline_scaling: false
  moud: true
  hiv_testing: true
  overdose: true
  oud_state: true

# =========================
# OUD STATE (GLOBAL, USED)
# =========================
oud_state:
  init_active: 0.70
  init_remission: 0.30
  init_none: 0.0   # OUD-only population

  transitions:
    incidence_rate_per_year: 0.0

    remission_rate_per_year: 0.15
    relapse_rate_per_year: 0.35

    early_relapse_window: 26
    early_relapse_rr: 2.5

    relapse_risk_window: 8
    relapse_to_inj_prob: 0.5

    inject_start_rate_per_year: 0.02
    inject_stop_rate_per_year: 0.10

    moud_remission_rr: 1.5

# =========================
# MOUD
# =========================
moud:
  start_time: 0
  use_reinit: true

  init: 0.02
  reinitiation_rr: 2.0
  post_relapse_rr: 1.5
  post_overdose_rr: 2.0

  early_window: 26
  early_discontinue: 0.08
  late_discontinue: 0.01

  overdose_scale:
    active: 0.4
    inactive: 1.0

  injection_scale:
    active: 0.7
    inactive: 1.0

# =========================
# OVERDOSE
# =========================
overdose:
  base_prob_inj: 0.50
  base_prob_noninj: 0.007
  fatal_frac: 0.12

  high_risk_mult: 2.0
  ssp_rr: 0.8
  post_relapse_od_rr: 2.0

# =========================
# SYRINGE SERVICES
# =========================
syringe_services:
  timeline:
    ssp_open:
      start_time: 1
      stop_time: 240
      num_slots_start: 100
      num_slots_stop: 200
      risk: 0.02

# =========================
# HIV (LEGACY DX DISABLED)
# =========================

aids:
  prob: 0.01
  init: 0.05

background_sex:
  rate_nonoud_per_timestep: 0.5
  partner_hiv_prevalence_nonoud: 0.01
  inj_multiplier: 1.5

# =========================
# HIV TESTING (PRIMARY DX MECHANISM)
# =========================
hiv_testing:
  start_time: 0
  base_prob: 0.01

  pwid_mult: 2.0
  oud_mult: 1.5
  high_risk_mult: 2.0

  moud_early_window: 26
  moud_early_mult: 2.0
  moud_stable_mult: 1.3

  post_relapse_mult: 2.0
  post_overdose_mult: 3.0


# =========================
# PrEP / KNOWLEDGE / SSP
# =========================
prep:
  init: 0.10
  cap: 0.10
  cap_as_prob: false

knowledge:
  prob: 0.30
  opinion:
    prob: 0.50
