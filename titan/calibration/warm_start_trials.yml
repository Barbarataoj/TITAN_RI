# Designed starting points for the refit's first generation (Stage D4).
#
# Read by optuna_calibration.warm_start_trials() and handed to
# study.enqueue_trial() before study.optimize() runs, so NSGA-II's initial
# population contains points that are already known to satisfy part of the gate
# vector instead of being drawn uniformly from the box.
#
# WHY A FILE AND NOT A LOOKUP. Every vector here was lifted from a trial YAML
# under /oscar/scratch/$USER/titan_calibration/optuna_multi_runs/, which is
# scratch: job 4874631's trial files are not backed up and will be purged. The
# warm start is part of the search design and has to survive that, so the
# vectors are materialised here with their provenance rather than re-read from
# scratch at launch time.
#
# RE-ANCHORING. These trials predate several changes to the search, so a vector
# lifted verbatim is not a point in today's box. The corrections applied to
# every entry are recorded per entry under `deviations`:
#
#   1. `calibration.injection.act` did not exist as a fitted parameter until
#      2026-08-13, when `partnership.injection.transmission.base` was pinned at
#      the published 0.0063 and the scaling half became the fitted one. Only the
#      PRODUCT is identifiable (see the block in objective()), so the value
#      recorded here is the trial's own fitted base divided by 0.0063 -- it puts
#      the injection route at the transmission level the trial was fitted at.
#   2. Seven coordinates left the search on 2026-09-29 and are now fixed from
#      data (calibration_targets.yml `anchored_parameters`, plus the derived
#      fatal fraction): hiv_testing.base_prob_annual, moud.post_overdose_rr,
#      moud.discontinue_per_month, moud.overdose_scale.active,
#      overdose.high_risk_mult, overdose.fatal_frac and
#      oud_state.transitions.relapse_to_inj_prob. Each entry's original values
#      for those seven are recorded under `dropped` so the point can still be
#      compared with the run it came from.
#   3. Two coordinates were RE-DERIVED rather than dropped, because the pins
#      change what they have to be:
#        * moud.reinit_prob: with discontinuation fixed at 0.078, the coverage
#          series (0.69 rising to 0.82) needs an ever-on equilibrium of at
#          least 0.82, i.e. reinit >= 0.355. Every entry is set to 0.36; the
#          original values (0.12-0.19, fitted alongside discontinuation rates of
#          0.088-0.145) encode the old pairing, not a starting point for this
#          one.
#        * overdose.base_prob_inj / _noninj: moud.overdose_scale.active moved
#          from the trials' 0.40-0.61 to 0.30 and coverage over the scoring
#          window rises to ~0.8, so the off/on blend the base probabilities are
#          multiplied by falls from ~0.66-0.80 to ~0.43. Each entry's pair is
#          scaled by the ratio of those blends (1.55-1.9x) so the nonfatal
#          rates land near where the trial had them. Approximate by
#          construction -- the search owns these two coordinates.
#
#   4. Later on 2026-09-29 calibration.sex.act left the search (fixed at
#      1.0) and calibration.background.msm_inj_mult joined it. Every entry
#      starts that multiplier at 6.0, the value the RIDOH MSM/IDU count
#      implies (~40 outside acts a year at partner prevalence 0.10); the
#      trials' own sex.act values no longer mean anything and are dropped.
#      The `hiv_grid_solved` entry was removed for the same reason -- it
#      was a sex.act solution.
#
# The vectors must cover exactly the paths in
# calibration_targets.yml parameters_to_optimize, and every value must lie in
# that parameter's box. warm_start_trials() enforces both at startup so a
# stale entry fails the run before any compute is spent, the same way
# assert_not_fitted() does for the anchors.

#
#   3. 2026-10-01: features.care_seeking is on. `moud.reinit_prob` left the
#      search (anchored at 0.3667, read only by init_at_equilibrium) and two
#      coordinates joined it: `moud.acceptance` and
#      `hiv_testing.nonclinical_annual`. No earlier trial measured either, so
#      every entry starts them at 0.75 and 0.4 (the 2026-10-01 smoke run's feasible corner); the vectors below are
#      starting points for the other eight coordinates, not full measured points.

warm_start:

  # The point od_err was measured reachable at. Job 5053123 ran trial 290's
  # vector with both overdose base probabilities scaled by 0.80 and measured
  # od_err = 0.00327 against a 0.01 gate, with oud_rmse also passing, at 8
  # population seeds x 40 replicates. See
  # docs/calibration_log/phase_6_od_reachability_2026-08-24.md. The overdose
  # pair here is that measured point rescaled for the 2026-09-29 pins (x1.9).
  #
  # `calibration.injection.act` is 1.0 here, NOT trial 290's fitted level: the
  # probe built its scenario from the anchored base, which carries the engine
  # default of 1.0, so 1.0 is the value the measured od_err was produced at.
  # The level-preserving variant is the next entry.
  - label: t290_s0.8
    source: >-
      trial 290 of job 4874631, both overdose base probabilities x 0.80,
      as run by analysis/probe_od_reachability.py (job 5053123)
    deviations:
      - "calibration.injection.act 1.0 -- the engine default the probe ran, not
         trial 290's fitted injection level"
      - "moud.reinit_prob 0.14662444 -> 0.36 (re-derived for discontinuation 0.078)"
      - "overdose.base_prob_inj 0.14107456 -> 0.268, _noninj 0.06081623 -> 0.1155
         (x1.9 for overdose_scale.active 0.608 -> 0.30 and coverage 0.50 -> 0.82)"
    dropped:
      hiv_testing.base_prob_annual: 0.2            # clipped from 0.486567; fixed 0.155 (09-29), 0.08 (09-30); inert with care_seeking on
      moud.post_overdose_rr: 2.23271398            # fixed 1.0 (09-29), 0.42 (10-01, APCD job 2b); inert with care_seeking on
      moud.discontinue_per_month: 0.14479567       # now fixed 0.078
      moud.overdose_scale.active: 0.60844793       # now fixed 0.30
      overdose.high_risk_mult: 1.67477959          # now fixed 1.6
      overdose.fatal_frac: 0.20645548              # now derived 0.201
      oud_state.transitions.relapse_to_inj_prob: 0.76077044   # now fixed 0.5
    params:
      oud_state.transitions.remission_rate_per_year: 0.23043358
      oud_state.transitions.relapse_rate_per_year: 0.31921235
      overdose.base_prob_inj: 0.268
      overdose.base_prob_noninj: 0.1155
      moud.injection_scale.active: 0.55057546
      moud.acceptance: 0.75                # 2026-10-01: care_seeking on; reinit_prob (was 0.36) anchored, acceptance is the MOUD lever
      hiv_testing.nonclinical_annual: 0.4  # 2026-10-01: new lever; smoke run puts the testing band at ~0.4
      calibration.background.msm_inj_mult: 6.0
      calibration.injection.act: 1.0
      high_risk.partner_scale: 8
      trend.moud_acceptance_ratio: 1.6     # 2026-10-05: MOUD trend added to the search; probe values
      trend.moud_discontinue_ratio: 0.75

  # The same overdose corner at trial 290's own injection transmission level.
