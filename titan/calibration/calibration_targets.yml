      upper: 0.40

    - path: "overdose.base_prob_noninj"
      lower: 0.03      # 2026-09-29; refit box 2026-08-11 was [0.0562739, 0.0786008]; prior [0.005, 0.08]
      upper: 0.16

    # overdose.fatal_frac was REMOVED here 2026-09-29 (box was [0.175536,
    # 0.210156]). It is DERIVED from the overdose targets by
    # derived_fatal_frac() -- the engine rolls it as a flat per-event coin flip,
    # so the targets fix it at 0.015 / (0.015 + 0.0597) = 0.201 whatever the
    # search does, and fitting it alongside a fatal-rate target stated one
    # number twice.
    #
    # overdose.high_risk_mult was REMOVED here 2026-09-29 (box was [1.44995,
    # 2.47922]) and fixed at 1.6 under anchored_parameters.

    # ---- MOUD dynamics ----
    # moud.overdose_scale.active was REMOVED here 2026-09-29 (box was [0.316196,
    # 0.70]) and fixed at 0.30 under anchored_parameters.

    - path: "moud.injection_scale.active"
      lower: 0.412639   # refit box 2026-08-11; prior bound 0.40
      upper: 0.805525   # refit box 2026-08-11; prior bound 0.90

    # moud.discontinue_per_month was REMOVED here 2026-09-29 (box was
    # [0.0374973, 0.173124]) and fixed at the Hallowell 0.078 under
    # anchored_parameters.

    # MOUD re-initiation per month (top-level override, moud.py update_agent STEP 2).
    # The equilibrium coverage ceiling among ever-on agents is
    # reinit_prob/(reinit_prob+discontinue_per_month); with reinit previously fixed at
    # the demographic default the model capped ~0.62-0.77 and could not reach the
    # 0.82 (2022) target. Bounds span ~3-20-month re-engagement: at disc=0.06,
    # reinit=0.27 -> equilibrium 0.82. Added 2026-07-24 with the init_coverage lever
    # so MOUD coverage is genuinely fit (not hand-set). See calibration_log.
    #
    # UPPER BOUND 0.338 -> 0.50, 2026-09-29. With discontinuation fixed at 0.078
    # the 2022 coverage of 0.82 needs an ever-on equilibrium of at least 0.82,
    # i.e. reinit >= 0.078 x 0.82 / 0.18 = 0.355, which the old box excluded.
    # 0.50 gives an equilibrium ceiling of 0.865.
    - path: "moud.reinit_prob"
      lower: 0.05
      upper: 0.50   # 2026-09-29; refit box 2026-08-11 was 0.338183; prior 0.35

    # NOTE: moud.init_coverage is deliberately NOT optimized (removed 2026-07-29).
    # It sets only the t=0 placement probability, and with use_reinit true coverage
    # converges to reinit_prob/(reinit_prob+discontinue_per_month) within ~3 years,
    # so it cannot affect an objective scored after burn-in. Measured: a fitted
    # 0.502 produced an observed 0.749, matching the 0.734 equilibrium set by the
    # two parameters above. Same class of dead search dimension as hiv.dx.prob
    # (A8). The scenarios now set moud.init_at_equilibrium instead, which starts the
    # run at that equilibrium and removes the transient rather than fitting a value
    # that gets overwritten. See EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P6.

    # moud.post_overdose_rr was REMOVED here 2026-09-29 (box was [1.0, 4.3454])
    # and fixed at 1.0 under anchored_parameters -- the Larochelle derivation the
    # audit proposed is unreachable at any value in the box; see the entry there.

    # ---- HIV transmission & testing ----
    # Per-act injection HIV transmission (canonical 0.0063; allow wider for RI fit)
    #
    # LOWER BOUND DROPPED 0.001 -> 0.0003, 2026-08-07 (job 4779604). At burn 720
    # the RIDOH-consistent transmission level is `acquisition ~0.35` equivalent,
    # which on trial 1267's value works out to 0.003943 x 0.35 = 0.00138 -- only
    # 38% above the old bound. A feasible region that close to the wall gives a
    # boundary solution and a truncated posterior, and it would be read as "the
    # optimizer wants less transmission than the model allows" when the real
    # answer is that the box was drawn too narrow.
    #
    # The old bound was set when the network sexual route was inert (see the
    # sex.frequency block below) and this parameter was absorbing the whole
    # epidemic, so 0.001 was a plausible floor then. With the sexual route live
    # and the SSP block re-anchored it no longer is.
    # REMOVED 2026-08-13 (step 4 of the 2026-08-12 plan). Fixed at the published
    # 0.0063 as INJECTION_TRANSMISSION_BASE in optuna_calibration.py, applied by
    # set_per_act_transmission() and guarded by assert_not_fitted().
    #
    # The box above ran [0.000580802, 0.00465604]. The canonical per-act value is
    # 0.0063, so THE LITERATURE VALUE SAT ABOVE THE ENTIRE SEARCH RANGE -- every
    # trial ever run used an injection transmission probability below what the
    # evidence supports, the best-scoring one about five times below it. That is
    # the mechanism behind the route split this calibration has been fighting:
    # the injection route carried 5-14% of incidence because it was bounded away
    # from its measured value, and the sexual route absorbed the rest.
    #
    # Units checked before pinning: the model applies this per SHARING act (the
    # act filter in titan/interactions/injection.py:47-89 drops safe acts before
    # exposure), which is what the 0.0063 estimate measures. See the constant.
    #
    # This and the two-series HIV objective are a PAIR. With the parameter free,
    # the cheapest way to fit RIDOH's IDU series is to crush this value and let
    # the sexual route carry the epidemic -- scoring well while inerting the one
    # route the interventions act on. Fixing it closes that; calibration.sex.act
    # stays fitted as the sexual-side lever.
    #
    # MEASURED CONSEQUENCE, job 4944499 (probe_injection_pin, 20 reps x 2
    # population seeds, all post-step-3 anchors in force). ridoh_hiv_err against
    # a 1.1 pass threshold and a 4.782 null:
    #
    #   base      sex.act   ridoh_hiv_err   inj share of incidence   hiv_new
    #   0.00394   0.52          1.90                 0.43              46
    #   0.00466   0.52          3.99                 0.53              56
    #   0.00630   0.52          5.83                 0.60              83
    #   0.00900   0.52         22.24                 0.78             170
    #   0.00630   0.25          4.31                 0.77              47
    #   0.00630   1.50         15.01                 0.38             228
    #
    # AT THE PUBLISHED VALUE THE MODEL CANNOT REACH RIDOH, and the sexual lever
    # cannot rescue it. Compare row 1 with row 5: the same total incidence (46 vs
    # 47) scores 1.90 against 4.31, because the objective scores the injection
    # route separately. RIDOH's own categories say IDU-attributed diagnoses run
    # 1.8-2.5/yr against 5.4-8.7 for IDU + MSM/IDU -- only about 30% of diagnoses
    # among PWID are injection-attributed. Pinning the per-act value drives the
    # model's injection share to 0.60-0.82, which contradicts that split.
    #
    # So the per-act probability is not the term that was wrong. What the model
    # over-states is EXPOSURE FREQUENCY: acts per partnership per month, and
    # partners per PWID. Both are uncited (citations GAP #36, #37) while the
    # per-act probability is measured -- the calibration had it exactly backwards,
    # fitting the quantity with a published value and fixing the ones without.
    # calibration.injection.act is therefore added to the search below.

    # REMOVED 2026-07-30: hiv.background_sex.per_act_transmission_prob.
    #
    # The premise above -- "complementary to, not double-counting with, the
    # network sexual route" -- is right about the ROUTE and wrong about the
    # PARAMETER. The exogenous route is genuinely needed (the modelled population
    # is 100% ever-OUD, so sex with non-OUD partners cannot be a partnership), but
    # its per-act transmission probability is the same biological quantity as the
    # network route's, and fitting it separately gave the model two free levers on
    # one constant. Measured consequence in the post-rebuild run: it was fitted to
    # 0.002805 -- 94% of its upper bound, and 3.5-7x the heterosexual per-act value
    # it was being applied to -- and delivered 12 of 21 infections, 57% of all
    # incidence, through the one route no modelled intervention can touch. A
    # scenario comparison run on that fit would understate every intervention.
    #
    # hiv.py now reads partnership.sex.acquisition[sex_type][sex_role] for this
    # route, so it inherits F1's fix. The exogenous magnitude is now set only by
    # observable inputs: rate_nonoud_per_timestep and partner_hiv_prevalence_nonoud
    # (the latter is citations GAP #27 and still needs a source -- see
    # validation_targets). calibration.acquisition continues to scale both routes
    # together, which is the intended shared lever.

    # Scalar on sex acts per partnership per timestep, applied to every
    # sex-carrying bond in titan/interactions/sex.py. This is the lever that fits
    # the NETWORK sexual transmission route.
    #
    # Fitted rather than pinned because no RI-specific PWID/OUD coital-frequency
    # data exists. The scenarios set partnership.sex.frequency to a Poisson with an
    # NSFG-anchored prior mean of 4.0 acts/month, so these bounds span roughly 1-12
    # acts/month. One scalar covers both Sex and SexInj, keeping this to a single
    # search dimension.
    #
    # Added 2026-07-29. Before that, partnership.sex.frequency was absent from every
    # RI parameter file and fell back to a default bin of min:0/max:1 which, because
    # utils.safe_random_int is half-open, yielded zero acts forever:
    # Sex.get_num_acts returned >=1 act on 0 of 369,609 calls. Network sexual
    # transmission was structurally absent from every result the project has
    # produced, and partnership.injection.transmission.base plus
    # calibration.acquisition absorbed the entire epidemic in its place -- so those
    # two are expected to move substantially in this refit. Turning the route on at
    # the only other frequency in the repo (tests/params/oud_ri_baseline.yml,
    # ~19 acts/month) drove prevalence to 95%, which brackets how sensitive this is.
    # See EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P1.
    #
    # UPPER BOUND 2.535 -> 4.0, 2026-09-29, from analysis/probe_hiv_grid.py (job
    # 6812107; 6 x 6 grid, 8 populations x 10 replicates, pins applied). With
    # everything else at warm start t301 the all-route PWID series reaches its
    # 8.7/yr target only at the very top of the old box (8.72 at sex.act 2.535,
    # injection.act 1.5, where the injection series overshoots 2x), the one
    # feasible point (0.89 corrected) sits on the old upper bound, and the
    # log-linear solve for both 2018-2022 windows lands at sex.act 2.87 /
    # injection.act 0.84 -- outside it. Nowhere on the grid scores worse than
    # null, so the "dead region at the top" that motivated the 2026-08-11 cut
    # does not exist under the pinned configuration. 4.0 is ~16 acts/month on
    # the NSFG-anchored 4.0/month prior mean; the solved point is enqueued as a
    # warm start.
    #
    # REMOVED FROM THE SEARCH, later on 2026-09-29, and replaced by
    # calibration.background.msm_inj_mult below. Fixed at the NSFG prior 1.0 in
    # the base scenario and guarded by ANCHORED_PATHS. Grid 3 (job 6824974),
    # run with male-male partnerships decoupled onto calibration.sex.act_msm,
    # showed the all-route PWID series barely answers this scalar (elasticity
    # 0.23; the log-linear solve for the RIDOH windows landed at 14.8): the
    # all-route count had been coming through the MSM route all along, which is
    # what RIDOH's MSM/IDU category (71% of PWID diagnoses) says. The last box
    # was [0.38765, 4.0].

    # Outside sexual exposure of MSM/MSMW who INJECT, as a multiplier on the
    # background act rate in place of hiv.background_sex.inj_multiplier (1.5).
    # ADDED 2026-09-29 (Jun, option A). RIDOH: 6.2 of 8.7 PWID diagnoses a year
    # (2018-2022) are MSM/IDU, i.e. ~3%/yr incidence among roughly 200-250 MSM
    # who inject statewide. With the internal MSM pool held at a plausible 0.20
    # prevalence (act_msm 0.47, derived) the model produces 2.5-3.1 all-route
    # diagnoses a year against 8.7 (analysis/probe_act_msm.py, job 6826397), so
    # this group needs an outside exposure the all-agent multiplier does not
    # give it. Reaching ~3%/yr at partner prevalence 0.10 and 0.00745 per act
    # needs ~40 outside acts a year, about 6x the base 0.5/step -- NHBS finds
    # MSM who inject at 2-3x the HIV prevalence of MSM overall. Box [1.5, 12]:
    # the floor is the all-agent value.
    #
    # This is an exogenous route, which audit F9 warned against as a FITTED
    # lever. The difference here: it is fitted to the one series that
    # identifies it (all-route minus injection-attributed = mostly MSM/IDU),
    # its target group is named, and the PrEP and testing arms still act on it
    # through the acquisition-side multipliers. MOUD and SSP arms cannot reach
    # these infections, which is a finding about Rhode Island's epidemic to
    # state, not a model artefact to hide.
    #
    # UPPER BOUND 12 -> 20, 2026-09-29: against the opioid-adjusted all-route
    # target grid 4's best point sat on the old upper bound (12).
    - path: "calibration.background.msm_inj_mult"
      lower: 1.5
      upper: 20.0

    # Injection exposure frequency, ADDED TO THE SEARCH 2026-08-13 (step 4).
    # Scales mean_num_acts in titan/interactions/injection.py:43-46, i.e. shared
    # injection acts per partnership per timestep, before the unsafe-probability
    # filter.
    #
    # This is the counterpart to pinning partnership.injection.transmission.base.
    # The two are a product for the injection route and only the product is
    # identifiable, which is exactly why this parameter was NOT fitted while the
    # per-act probability was. That arrangement fitted the quantity with a
    # published estimate (0.0063, citations #31) and fixed the one without
    # (num_acts = 10/month, GAP #36). Swapping them leaves the likelihood
    # unchanged and the interpretation much better: the fitted value is now a
    # statement about sharing frequency, which NHBS-PWID can check, rather than
    # about a per-act biology already measured.
    #
    # BOX. The engine default is 1.0 against demographics num_acts = 10 per
    # month. The retired base box mapped to [0.09, 0.74] of the published per-act
    # value; the best-scoring arm of job 4944499 sits at 0.62 and is still 1.7x
    # the pass threshold, so the feasible region is below it and the lower bound
    # has to go well under the old floor. Upper bound 1.5 keeps the engine
    # default interior rather than at a wall.
    #
    # SANITY-CHECK THE FITTED VALUE, do not just accept it: 0.10 means roughly
    # one shared injection per partnership per month before the ~25% unsafe
    # filter. If the fit lands at the bottom of this box, the exposure structure
    # is wrong somewhere else -- partners per PWID (GAP #37) is the next suspect,
    # and pop_scale after that.
    - path: "calibration.injection.act"
      lower: 0.05
      upper: 1.5

    # NOTE: hiv.dx.prob is deliberately NOT optimized. Its only consumer is the
    # legacy per-step diagnosis roll in titan/exposures/hiv.py, which is gated
    # off whenever features.hiv_testing is true (as it is in every scenario
    # here). Optimizing it added a search dimension that could not affect any
    # objective. Diagnosis is driven by the hiv_testing feature instead.

    # Annual HIV testing base probability among PWID/OUD
    # (renamed from hiv_testing.base_prob, which was a per-timestep probability)
    # RE-BOUNDED 2026-08-12 from [0.133949, 0.545579].
    #
    # The old box saturated the diagnosis cascade at every value it contained.
    # Measured by probe_seed_burn round 2 (trial 290, burn 120, 20 runs/arm),
    # diagnosed fraction among people with HIV against this parameter:
    #
    #   0.020 -> 0.827     0.050 -> 0.916 / 0.925
    #   0.100 -> 0.919     0.211 -> 0.975 / 0.981
    #
    # RIDOH's measured value is 0.932 (2022 HIV care continuum: 2,796 of ~3,000
    # people living with HIV in Rhode Island know their status; 76.1% engaged in
    # care, 71% virally suppressed). Interpolating the dose-response puts the
    # matching annual probability near 0.12. Everything above ~0.15 saturates, so
    # the old box was effectively usable only at its bottom edge, and the fitted
    # 0.211 sat well inside the saturating region.
    #
    # Saturation is not cosmetic: at 0.99 diagnosed the undiagnosed reservoir is
    # ~1/8 of its real size, which is the population scenario 5 (MOUD + HIV
    # testing) exists to reach. It also makes this parameter nominally fitted but
    # unable to change any scored quantity.
    #
    # Corroboration from the same RIDOH report: only 60% of Rhode Island adults
    # with multiple sexual partners have EVER received an HIV test. An annual
    # probability whose old floor was 0.134 is not compatible with that.
    #
    # Closes citations GAP #28 (HIV testing rate) and GAP #29 (% HIV-diagnosed).
    #
    # hiv_testing.base_prob_annual was REMOVED here 2026-09-29 (box was [0.05,
    # 0.20]) and fixed at 0.155 under anchored_parameters: NHBS-PWID measures the
    # quantity directly and nothing in the search could identify it (0.0003 of
    # R^2). The block above stays as the record of the saturation measurement.

    # ---- Network structure ----
    # Linear partner-count boost during a high-risk burst (~20% of agents, ~6-step
    # duration). Schema default 300 was sized for populations of 6,000-172,000
    # (Atlanta/Mississippi/NYC/Philly-GIS/legacy-RI settings); at this scenario's
    # num_pop=500 it swamps the network entirely. Philly-GIS is this repo's own
    # precedent for scaling it down (300->3). Tuned here rather than hand-picked,
    # since the right value is a calibration question. `type: int` because the
    # schema requires an int (see optuna_calibration.py's set_yaml_value/suggest_int
    # handling for "type" entries, added alongside this parameter 2026-07-21).
    # See docs/calibration_log/phase_4_num_partners_fix_2026-07-21.md.
    - path: "high_risk.partner_scale"
      lower: 1
      upper: 17   # refit box 2026-08-11; prior bound 20 NEW
      type: int

  # --------------------------------------------
  # Stopping criteria (Optuna-level)
  # --------------------------------------------
  tolerance:
    max_error: 0.02
    max_iterations: 200       # widened to give NSGA-II room in higher-dim space
