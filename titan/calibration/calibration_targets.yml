calibration:
  mode: "oud_hiv_trajectory"

  # --------------------------------------------
  # Population & time horizon
  # --------------------------------------------
  # N=500 with 10 MC reps — chosen after profiling showed O(n^2) in partner
  # assignment. Per-agent-yr stochasticity at N=500*10reps = 5000 person-yrs
  # is statistically equivalent to N=1000*5reps but 3x faster wallclock.
  # Burn was trimmed from 120 to 36 steps on the claim that "OUD/MOUD equilibrate
  # within 2-3 yr at calibrated rates". Measured 2026-07-29, they do not: at t=0
  # the injection share was still falling (0.26, settling ~0.19 around year 4-5)
  # and MOUD coverage was still climbing (0.49 toward its 0.73 equilibrium, reached
  # ~year 5), so the first several years of every scenario comparison were
  # transient. Raised to 60 (5 yr). Two initial-condition fixes landed at the same
  # time and shrink what the burn-in has to absorb: Inj.ppl 0.50 -> 0.25 (P2) and
  # moud.init_at_equilibrium (P6). See EPIDEMIC_DYNAMICS_MAP_2026-07-29.md P8.
  # N=5000+ is not feasible with current engine (estimated 10 min/trial);
  # requires fixing the O(n^2) in titan/population.py update_agent_partners.
  # STATISTICAL POWER, settled 2026-07-30. EPIDEMIC_DYNAMICS_MAP_2026-07-29.md
  # finding P4 held that hiv_traj_rmse "is fitting Monte Carlo noise at N=500".
  # A Poisson power analysis over the actual pooled denominator says that is
  # overstated. Reps are pooled by parse_basic_report's groupby("t").sum(), so the
  # effective denominator is size x injection_share x n_runs:
  #
  #   pooled PWID   P(correct level beats a 2x-wrong one)   P(shape beats flat-at-mean)
  #     550 (now)                 1.00 / 0.83                        0.878
  #    1250                       1.00 / 0.99                        0.982
  #    3750                       1.00 / 1.00                        1.000
  #
  # 550 is what the model currently delivers, because its injection share sits at
  # 0.11 rather than the 0.45 target -- a 4x shrunken denominator. At the target
  # share the same config gives 1250 and the objective resolves both level and
  # shape. So P4's cure is the injection-share refit, not a larger population:
  # size 500 x 10 reps is adequate ONCE inj_share_err is satisfied. Re-check this
  # if the refit leaves the injection share short.
  #
  # Two genuine defects did come out of the same analysis and are fixed:
  #   * the canonical-pick transmission screen was a flat 2 pooled infections,
  #     ~2% of the ~90 the targets imply. It is now derived from the targets --
  #     see optuna_calibration.min_transmission_events.
  #   * hiv_traj_rmse compares the model's TRUE incidence (hiv_new) against a
  #     DIAGNOSED-incidence claims proxy. The parser now also reports
  #     hiv_dx_incidence_series_pwid (from hiv_dx_new) so the gap is visible. The
  #     two coincide only at equilibrium in the undiagnosed pool; post-rebuild
  #     dx_among_hiv is ~0.97, so the bias is small but systematic.
  # PINNED 2026-08-04. burn_steps is a STRUCTURAL CHOICE that sets the level the
  # HIV objective sees, not a neutral warm-up, and it must not be changed without
  # re-deriving every HIV target comparison.
  #
  # Measured by titan/calibration/probe_burnin_length.py (4 burn lengths x 3
  # population seeds x 10 reps, figure at docs/figures/burnin_probe.png):
  #
  #   burn_steps            60      120      240      360
  #   PWID HIV prev      0.115    0.153    0.204    0.270
  #   NonInj HIV prev    0.073    0.102    0.127    0.170
  #   IDU dx/model-yr    0.279    0.342    0.485    0.479
  #   injection share    0.383    0.397    0.458    0.486
  #   MOUD coverage      0.703    0.714    0.707    0.719
  #   active OUD share   0.569    0.558    0.552    0.548
  #
  # Two separate findings in that table:
  #
  # (a) HIV NEVER EQUILIBRATES. Prevalence rises monotonically and roughly
  #     exponentially in burn length with no sign of turning over -- 30 years of
  #     burn-in and still climbing, against a 6.2% reference. There is no endemic
  #     equilibrium to burn in to at this transmission level, so no burn_steps
  #     value absorbs the initial conditions and a longer burn-in strictly makes
  #     the HIV level worse. This is the same fact as the dwell-time wall
  #     documented under hiv.incidence_series_per_pwid_yr, shown directly.
  #
  # (b) The OUD side IS equilibrated and is insensitive to burn length: MOUD and
  #     active-OUD share move <2% across a 6x sweep. Injection share is the one
  #     exception -- it is still transient at 60 and settles near 0.486, ABOVE
  #     its 0.45 target, so the current fit reaches 0.45 only by scoring a
  #     transient.
  #
  # 60 is KEPT because the two findings pull opposite ways: lengthening fixes the
  # injection-share transient and worsens HIV, and HIV is the binding constraint.
  # Revisit once the HIV level is RIDOH-consistent -- at that point prevalence may
  # plateau and a longer burn-in becomes free. Re-running the probe is the
  # acceptance test.
  #
  # REVISITED AND CHANGED TO 720, 2026-08-07 (job 4779604). The acceptance test
  # above was run, at three transmission levels rather than one, and finding (a)
  # does not survive it. Sweeping burn 60/240/720/1440 x acquisition 1.0/0.5/0.35:
  #
  #   PWID HIV prevalence at end of burn-in
  #   burn          acq 1.0   acq 0.5   acq 0.35
  #     60           0.0392    0.0344     0.0260
  #    240           0.0517    0.0311     0.0223
  #    720           0.1099    0.0431     0.0261
  #   1440           0.1535    0.0448     0.0348
  #
  # "HIV never equilibrates" was a property of the transmission LEVEL, not the
  # model. At acq 1.0 it gains another 40% between 720 and 1440; at 0.5 it settles
  # at ~0.045 by 720; at 0.35 it settles near 0.03 without collapsing, so the
  # threshold is not between them and the fit will not sit on a critical point.
  # The equilibrium is approached from BOTH directions -- the Inj compartment
  # relaxes down from its 0.075 seed to 0.0431 while NonInj builds up from 0.0004
  # to 0.0367 -- which is an attractor, not a flat-looking transient.
  #
  # 720 is where both compartments flatten. It is set here on evidence rather than
  # pinned by default, and it makes calibration.noninj_hiv_init_het redundant (the
  # reservoir builds itself), so that parameter left the search on the same date.
  #
  # FINDING (b) INVERTS, but it is not a cost. Injection share equilibrates at
  # ~0.545 against a 0.45 target, flat from 720 on -- the `ever_injected` one-way
  # latch predicted under `injecting` below, now measured.
  #
  # This was first read as a structural conflict with burn_steps=720. It is not.
  # Job 4779604 varied burn length and `acquisition`, an HIV parameter; it never
  # varied the five OUD transition rates, which are what actually set this
  # quantity. Scanning those at equilibrium with the latch left in place (9^5
  # points over the bounds below, analysis/oud_feasibility_2026-07-30/
  # recency_precheck.py): equilibrium inj_of_active spans 0.066-0.712, and 471 of
  # 59,049 points (0.8%) hit 0.45 and oud_active 0.55 jointly within +/-0.02.
  # Trial 1267's 0.545 is a high corner of the box, not a ceiling.
  #
  # For scale, scan.py finds 179/59,049 (0.30%) hitting both on the scored-window
  # TRANSIENT against 471 (0.80%) at equilibrium -- joint feasibility is ~2.7x
  # better at equilibrium, so burn 720 improves the injection-share fit rather
  # than breaking it. (The 148/0.25% figure this file quoted from 2026-07-30 was
  # computed with a uniform death rate; see the oud_chain.py docstring. The
  # correction moves the number, not the conclusion.)
  #
  # A recency-window replacement for the latch was costed and REJECTED: it can
  # only lower the injection share, most of the box already sits below 0.45 with
  # the full latch, and where it is reachable the required window is 28 years.
  # See docs/calibration_log/phase_6_burnin_equilibrium_2026-08-07.md.
  # SHORTENED 2026-08-12 to 120, and the NonInj seed restored alongside it.
  #
  # The 720 above was correct for a model whose HIV initial condition was zero:
  # with no reservoir seeded, the burn-in has to build one, and that takes
  # decades. Upstream TITAN does not have that problem because it treats
  # `hiv.init` and `hiv.dx.init` as data slots ("Probability that an agent in
  # this class initially has HIV") and ships `burn_steps: 6`. TITAN_RI moved both
  # slots into the search and then zeroed one, and 720 was the price.
  #
  # Restoring the seed removes the reason for the long burn. Measured by
  # probe_seed_burn (2026-08-12, trial 290 parameters, 6 arms x 20 runs):
  #
  #   burn 120, seed 0                PWID prevalence -21.8% across the scored
  #                                   window -- the reservoir has no time to
  #                                   rebuild, exactly as objective() warned
  #   burn 120, seed at equilibrium   PWID -1.9% to +2.1%, NonInj holds
  #   burn 240, seed                  MORE drift than 120, not less
  #
  # Note the last line. Once a realistic reservoir is present, a longer burn does
  # not settle the system at trial 290's transmission level -- it grows. The
  # equilibrium reported at burn 720 on 2026-08-07 was measured from a zero seed,
  # where the slow build-up masks the growth. That is a transmission-level
  # problem (see the injection/sexual route split and citations #31), not a burn
  # problem, and lengthening the burn cannot fix it.
  #
  # Seed and burn MUST move together. See set_noninj_hiv_init in
  # optuna_calibration.py -- zeroing the seed at a short burn is the A3 failure.
  population:
    size: 500
    steps: 132        # 11 years × 12 months
    burn_steps: 120   # was 720; see above. Requires a non-zero NonInj hiv.init.

    # Network realizations to score each trial across. ADDED 2026-08-17.
    #
    # This was a literal, `model.seed.ppl: 12345`, buried at line 4311 of the base
    # scenario, and nothing in the driver ever wrote it. Replicates vary
    # `model.seed.run` only, so all 40 of them draw the SAME population. Between-
    # population variance is therefore not sampling noise that replicates average
    # away -- within a study it is a fixed offset shared by every trial, and only
    # more entries in this list can reduce it.
    #
    # The consequence, unnoticed across jobs 4743939, 4830724 and 4874631: every
    # trial of every refit has been fitted to one network realization. Comparisons
    # BETWEEN trials stayed sound, because the offset is common to all of them,
    # which is why the search looked internally consistent. What is not sound is
    # the fitted values, which are conditioned on population 12345 -- and job
    # 4963250 measured that draw as worth about one gate-width on
    # hiv_prev_drift_pwid. It is also why validate_candidates, which HAS varied
    # this seed since Phase 4, has repeatedly been the step where candidates lose
    # their margin.
    #
    # Still a single entry today, so behaviour is unchanged. Stage A1 measures the
    # between- and within-population components separately and Stage A2 prices the
    # split at fixed budget (8 seeds x 5 reps against today's 1 x 40); Stage E
    # scores every trial across whatever list those choose, using the SAME list for
    # every trial so the comparison stays paired. See
    # docs/calibration_log/phase_6_completion_plan_2026-08-14.md sections 2.8-2.9.
    # Eight, from A1: the between-population term stops binding beyond that
    # (phase_6_noise_floor_2026-08-17.md section 3). This is the same list the
    # A1, A2 and C2 probes drew their seeds from, so their measured noise floors
    # apply to the refit unchanged rather than to a neighbouring design.
    #
    # WENT PLURAL 2026-09-01, when objective() started looping it (E1). Before
    # that the accessor existed and nothing called it, so the single entry was the
    # live behaviour and this block described a plan.
    population_seeds: [12345, 20260720, 777, 4242, 31337, 90210, 5150, 8675309]

    # Monte Carlo replicates per population seed. The engine takes this from the
    # -n CLI flag (params.model.num_reps is dead config that nothing reads), so it
    # is stated here to be recorded and passed, not to be read by TITAN.
    #
    # 40 -> 5 ON 2026-09-01, WITH THE SEED LIST GOING 1 -> 8. The product is what
    # a trial costs, and it is unchanged at 40 runs: this is the 8 x 5 the
    # completion plan's E1 specifies, not an increase. A1 measured that at fixed
    # total budget only the number of populations and the total run count matter,
    # so the split itself is free and the 8 populations are bought with the
    # replicates that were being spent re-drawing one.
    #
    # These two numbers are a pair, like the HIV seed and burn_steps: raising one
    # without lowering the other multiplies the refit's walltime by the ratio.
    # objective() passes this value to run_titan's n_reps, so TITAN_CALIB_REPS no
    # longer governs the refit -- it only affects callers that leave n_reps unset.
    reps_per_seed: 5

  n_runs: 10

  # --------------------------------------------
  # OUD baseline state distribution (STEADY-STATE)
  # --------------------------------------------
  # Split is defined over the EVER-OUD population (active + remission), matching
  # the denominator of the epidemiological literature (NESARC-III, ECA, NSDUH).
  # 0.55/0.45 active/remission is the literature-defensible UPPER end: national
  # cross-sectional estimates center on ~40% active / 60% remission, but this
  # cohort is severe (RI heroin/fentanyl), household surveys undercount exactly
  # these users, and the model has no long-term-recovery exit — so it represents
  # PERSISTENT OUD, which skews more active than the general ever-OUD population.
  # oud_none MUST stay 0 and the scenario must set init_none=0 (all ever-OUD);
  # otherwise the never-OUD pool enters the denominator and the objective is
  # unpassable regardless of transition tuning. Was 0.75/0.25 (uncited) before
  # 2026-07-20; see calibration_log phase_4 addendum for the full rationale.
  oud_baseline:
    oud_active: 0.55
    oud_remission: 0.45
    oud_none: 0.0   # all agents are ever-OUD; no susceptible compartment

  # --------------------------------------------
  # Injecting behavior among OUD-active agents
  # --------------------------------------------
  # SCORED as the 6th NSGA-II objective (inj_share_err) since 2026-07-29. It had
  # been defined here since the OUD redesign but optuna_calibration.py never read
  # it, so the injection share was unconstrained: it drifted 0.49 -> 0.18 over a
  # run with nothing objecting. Measured as person-time-weighted Inj share of
  # oud_active over the post-burn window. Note the paired initial condition,
  # demographics.*.drug_type.Inj.ppl, must equal injecting_pct x oud_active
  # (0.45 x 0.55 = 0.25) or the run starts away from its own target -- that key is
  # a POPULATION share and is not in parameters_to_optimize, so it does not
  # self-correct. See EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P2.
  # FEASIBILITY, settled 2026-07-30 (analysis/oud_feasibility_2026-07-30/).
  # EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P3 recorded this target as
  # UNREACHABLE ("equilibrium Inj-of-active-OUD is ~0.37 against a 0.45 target,
  # and no injection-block setting can raise it"). That verdict was reached under
  # the pre-fix parameterisation and does not survive the P2/P6/P7 fixes.
  #
  # A 7-state compartmental replica of oud_state.py -- validated against the
  # N=3000 post-rebuild run to within 1-2% on inj_of_active, active/remission
  # split, ever-injected share and population injection share -- was integrated
  # over a 9^5 grid of the five OUD search bounds below. Result:
  #
  #   inj_of_active spans 0.064-0.627 across the box          (target 0.45)
  #   conditional on hitting oud_active = 0.55 +/-0.02, it still spans
  #   0.079-0.562, so the two targets are not in conflict
  #   148 of 59,049 grid points hit BOTH within +/-0.02
  #
  # The currently-fitted vector misses (0.282) because relapse_rate 0.236 and
  # relapse_to_inj_prob 0.467 both sit below the feasible region (which needs
  # >=0.275 and >=0.51 respectively); inject_start must be >=0.044. All three are
  # free and inside their existing bounds, so NO re-bounding is required -- P3 is
  # a refit item, not a blocker.
  #
  # CAVEAT, and this one is real: `ever_injected` is a one-way latch that only
  # population turnover (1.1%/yr) resets, so it relaxes on a ~50-year timescale
  # against a 16-year run. inj_of_active is therefore NOT at steady state in the
  # scored window -- it drifts upward throughout:
  #
  #                       scored-window avg   t=16yr   equilibrium
  #   currently fitted          0.282          0.300      0.391
  #   a feasible vector         0.451          0.488      0.591
  #
  # So the comment below that this is a "steady-state target" is wrong about the
  # MODEL even where it is right about the DATA, and the parser's post-burn
  # time-averaging measures a transient whose level depends on Inj.ppl and the
  # baseline ever_injected draw. Consequences: (a) the fit is only valid for
  # exactly this burn_steps/num_steps window -- changing either invalidates it;
  # (b) lengthening the burn does NOT help, it overshoots; (c) scenario runs on a
  # longer horizon will show the injection share climbing for reasons unrelated
  # to the intervention, which will contaminate scenario contrasts. The durable
  # fix is to make relapse-to-injection depend on RECENCY of injection rather than
  # a permanent latch, which would give the quantity a genuine equilibrium. That
  # is a modelling-semantics decision, deliberately not taken here.
  #
  # ---------------------------------------------------------------------------
  # 2026-08-13, step 2: THIS TARGET IS NOW OUT OF REACH, AND IT IS UNCITED.
  # ---------------------------------------------------------------------------
  # Two things changed on 2026-08-13, and the second one is the important one.
  #
  # FIRST, inject_start and inject_stop left the search (see the note in
  # parameters_to_optimize) and are now fixed at 0.039 and 0.10 from the cohort
  # literature. analysis/step2_injection_anchor_2026-08-13/ re-ran the scan above
  # at the CURRENT window (burn 120, not 60) with drug-type-specific mortality:
  #
  #   s, e free, current boxes          201 of 59,049 points hit both targets
  #   s, e free, original wide bounds    263 of 59,049
  #   s = 0.039, e = 0.10 (anchored)       0 of 15,625, max inj_of_active 0.378
  #   s = 0.039, e = 0.052 (lowest)        0 of 15,625, max inj_of_active 0.406
  #
  # The binding constraint is the one this comment already recorded: reaching
  # 0.45 needs inject_start >= 0.0438. That threshold is reproduced exactly under
  # the new window and mortality model -- and it sits 12% ABOVE the published
  # 0.039. So the target and the literature value cannot both hold. Anchoring
  # moves the model toward the target rather than away from it (window average
  # 0.266 -> 0.299, equilibrium 0.335 -> 0.376), but not far enough to reach it.
  #
  # SECOND, and the reason this is not simply resolved by nudging inject_start:
  # 0.45 HAS NO SOURCE. RI_parameters_citations.md has no row for the share of
  # active OUD who currently inject. PROFOUND's 63,131 (#7, F6) is the SIZE of
  # the combined PWID + non-injection OUD pool, not its split. Retuning a
  # parameter that does have a citation in order to hit a number that does not
  # is fitting backwards.
  #
  # So this stays 0.45 pending a decision that is Jun's to make, and the
  # consequence has to be stated plainly: as long as inj_share_err remains one of
  # the five objectives, its floor is about (0.45 - 0.38)^2 = 0.005 against a
  # 0.0025 pass threshold, NSGA-II will push relapse_to_inj_prob to its ceiling
  # trying to close a gap it cannot close, and the front will be distorted by an
  # objective no parameter vector can satisfy. The three options are: source the
  # number, demote inj_share_err to a verification check (which is what step 5 of
  # the 2026-08-12 plan assumes), or re-derive the target from whatever the
  # source turns out to measure.
  #
  # ON THAT LAST OPTION, and it is the most likely resolution: at the anchored
  # rates, conditional on active_share = 0.55, the probe measured
  #
  #   currently injecting (inj_of_active)    0.225 - 0.378   median 0.296
  #   ever injected       (ever_inj_share)   0.492 - 0.509   median 0.500
  #
  # 0.45 is nowhere near the first and close to the second. If the number came
  # from a source describing people who have EVER injected -- which is how most
  # OUD cohort papers report it -- then it is being scored against the wrong
  # model quantity, and the model already sits within 11% of it with nothing
  # retuned. Not proof, but it is the cheapest thing to check first.
  # ---------------------------------------------------------------------------
  # RESOLVED 2026-08-13: 0.45 -> 0.32, from RI data. The block above stands as
  # the record of why it had to move; this is where the new number comes from.
  # ---------------------------------------------------------------------------
  # PRIMARY, and RI-specific: the Rhode Island Harm Reduction Surveillance System,
  # January 2021 - December 2022. Of 393 people who used illicit drugs in the
  # prior 30 days, 125 (31.8%) reported injection drug use. Race-stratified:
  # non-Hispanic white 48.2% (78/162), Hispanic 26.0% (25/96), non-Hispanic Black
  # 11.0% (8/73), other 22.6% (14/62). (PMC10872563.)
  #
  # CAVEATS, both of which cut the same way and are the reason this is not simply
  # adopted as exact. RIHRSS is a convenience sample recruited by canvassing at
  # syringe distribution programs, harm reduction outreach and street outreach in
  # overdose hotspots, so it OVER-represents people who inject relative to the
  # general OUD population -- 31.8% should read as an upper bound on its own
  # denominator. Against that, only 61.8% of participants used opioids in the
  # prior 30 days, so the denominator is people who use drugs, not people with
  # OUD, and the model's denominator is active OUD specifically.
  #
  # UPPER ANCHOR, national: among treatment admissions for heroin and synthetic
  # opioids, injection as the usual route peaked at 69.9% in 2014 and fell to
  # 52.2% by 2021 as smoking and snorting of fentanyl rose (PubMed 39216201).
  # That is the severe, treatment-entering end of the OUD spectrum and a genuine
  # ceiling for this quantity -- and note the direction of travel, which matters
  # for a fentanyl-era RI cohort scored over 2012-2022.
  #
  # So the defensible range is about 0.30-0.52 and 0.45 sat near its top with no
  # citation at all. 0.32 is chosen: it is the RI measurement, it is the era-
  # appropriate end of the national trend, and -- decisive for whether this can
  # be an objective rather than a diagnostic -- it is REACHABLE. The step 2 probe
  # put inj_of_active at 0.225-0.378 across the free box conditional on
  # oud_active = 0.55, median 0.296, against 0.45 which nothing in the box could
  # reach. inj_share_err becomes satisfiable rather than a permanent penalty
  # pushing relapse_to_inj_prob to its ceiling.
  #
  # SENSITIVITY: rerun at 0.26 and 0.52 (the RIHRSS Hispanic stratum and the
  # TEDS-A 2021 ceiling). Do NOT re-derive this from the model's ever-injected
  # share, which is a different quantity -- the model produces about 0.50 there,
  # and the coincidence with the old 0.45 is what made the old target plausible.
  injecting:
    injecting_pct: 0.32   # RIHRSS 2021-22, 125/393 = 31.8%; range 0.30-0.52. See above.

  # --------------------------------------------
  # Overdose calibration targets (ANNUALIZED, RI APCD T3)
  # --------------------------------------------
  # APCD per-stratum rates from RI_parameter_verification_APCD.md (#17, #18, T3 avg).
  # Weighted nonfatal at injecting_pct 0.32 = 0.32 * 0.091 + 0.68 * 0.045 = 0.0597
  # (the 0.066 below was weighted at the old, uncited 0.45 share and is kept only
  # as a record).
  # Fatal rate from RIDOH (#42 anchor): 256 OD deaths 2019 / ~13,704 OUD ≈ 0.018; keep 0.015 as conservative anchor.
  #
  # SCORING WINDOW AND THE FATAL TERM, 2026-09-29. T3 is 2021-2022, so the model
  # is scored on its last two years (optuna_calibration.OD_SCORING_YEARS), not
  # the final year alone. And od_err now scores the two NONFATAL rates only:
  # overdose.fatal_frac is a flat per-event coin flip in the engine, so it is
  # DERIVED from these targets -- fatal / (fatal + weighted nonfatal) = 0.015 /
  # (0.015 + 0.0597) = 0.201 -- and the fatal rate becomes a check rather than
  # a third, noisy, mechanically redundant component (it was 81.5% of trial
  # 561's od_err on 2026-08-17). See derived_fatal_frac() and od_error().
  #
  # Two things about 0.015 to keep straight:
  #   * RIDOH's deaths are all residents; the 13,704 denominator is insured
  #     people with an F11 diagnosis, the population the nonfatal rates and the
  #     MOUD series describe. Deaths / 13,704 (0.0187 in 2019, ~0.027 in 2022)
  #     therefore overstates this cohort's rate by the share of decedents
  #     outside it, which is unmeasured. 0.015 is roughly the 2019 figure at an
  #     ~80% in-cohort share and near the 2012-2022 window average, and it is a
  #     sensitivity axis (0.012-0.027), not a settled number.
  #   * RIDOH's own fatal fraction, 256 / (256 + ~1,501 EMS nonfatal) = 0.146, is
  #     NOT the model's fatal_frac. EMS attends about twice the nonfatal
  #     overdoses that claims record (RIDOH ~1,900/yr against APCD ~0.066 x
  #     13,704 = ~900/yr), so the two fractions have different denominators. The
  #     model's overdose event is the claims-recorded one, and 0.20 is the
  #     fraction on that footing.
  overdose:
    fatal_rate_annual: 0.015           # RIDOH deaths on the F11-insured footing; derives overdose.fatal_frac and is CHECKED, not scored, since 2026-09-29. See above.
    nonfatal_rate_annual: 0.066        # APCD T3 weighted at the old 0.45 share (record only; 0.0597 at 0.32)
    nonfatal_rate_inj_annual: 0.091    # APCD T3 (#17)
    nonfatal_rate_noninj_annual: 0.045 # APCD T3 (#18)

  # --------------------------------------------
  # MOUD engagement (TIME-AVERAGED)
  # --------------------------------------------
  # DENOMINATOR FIX 2026-07-20: the objective now scores MOUD coverage among
  # ACTIVE OUD (parser denominator = oud_active, numerator = moud_active), which
  # matches the APCD series denominator ("MOUD fills among F11-DIAGNOSED OUD in
  # year Y" ~= currently-active OUD). Previously the parser divided by
  # (oud_active + oud_remission), a larger denominator than the target's, which
  # forced the optimizer to inflate calibrated MOUD ~2x to hit the series and
  # created a spurious MOUD-vs-overdose tradeoff. The uptake_series below is now
  # the correct target for the active-OUD denominator and is used as-is (no rescale).
  # uptake_pct 0.40 is the coverage over TRUE OUD (active+remission) — a cross-check,
  # not the objective; expect ~0.40 there once the active-OUD coverage matches the series.
  moud:
    uptake_pct: 0.40                        # cross-check: MOUD over all true OUD (active+remission)
    uptake_pct_diagnosed: 0.815             # APCD T3 (#16), among-diagnosed = active-OUD denominator
    # Per-year MOUD coverage among ACTIVE OUD 2012–2022 (APCD #16/#43); denominator
    # = F11-dx OUD in year Y, matched to model oud_active. Used directly by the objective.
    uptake_series_years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
    uptake_series_per_yr: [0.692, 0.655, 0.690, 0.692, 0.673, 0.710, 0.753, 0.751, 0.776, 0.820, 0.810]

  # --------------------------------------------
  # HIV outcomes (OPTIMIZED — trajectory fit 2012–2022)
  # --------------------------------------------
  # Initial HIV prevalence among PWID at 2012 = first year of mofan's series ≈ 7.5%.
  # T3-avg baseline_prevalence_pct = 0.062 (APCD #25), used for steady-state check.
  # incidence_series is APCD #26 PWID HIV incidence per PWID-yr, 2012–2022 (decimal form).
  # DENOMINATOR MISMATCH, quantified 2026-07-30 (analysis/oud_feasibility_2026-07-30/
  # probe_denominator.py). Both HIV targets below are scored over agents whose
  # drug_type == "Inj" at the instant of measurement. oud_state flips drug_type to
  # NonInj the moment an agent enters remission, so that denominator is "injecting
  # right now". The APCD targets are built from a claims cohort, where an
  # injection-related code anywhere in claims year Y confers membership for the
  # whole of year Y. These are not the same population, and the gap is a factor of
  # two (N=3000, seed 17, final timestep of the post-rebuild run):
  #
  #     drug_type == Inj now    n= 322   prev 0.0186   <- what is scored
  #     injected in last 12 mo  n= 486   prev 0.0288   <- matches the target's build
  #     ever injected           n=1645   prev 0.0377
  #     whole population        n=3000   prev 0.0223
  #
  # The look-back denominator moves the model TOWARD 0.062, so roughly half the
  # apparent prevalence shortfall is a definitional artefact rather than missing
  # transmission. It is NOT swapped in here, because the same change cuts measured
  # incidence by the same ~1.5x -- the incident-case numerator is identical under
  # both denominators (7 cases) while the denominator grows -- making the
  # prevalence fit easier and the incidence fit harder. Which one to score is a
  # question about how APCD #25/#26 were extracted, not something to settle by
  # picking whichever flatters the model. OUDState now reports the look-back
  # denominator as `pwid_recent`/`pwid_recent_hiv` so both are visible in
  # validate_candidates; decide before committing compute to the refit.
  #
  # RESOLVED 2026-08-04: keep `drug_type == "Inj"`. The choice no longer matters.
  # Re-measured over job 4586902's front (2000 trials, transmission live on both
  # the injection and sexual routes), the two denominators now agree to within a
  # percentage point at every prevalence level:
  #
  #     trial   prev(Inj now)   prev(last 12 mo)   pooled infections
  #      1165       0.158            0.159                217
  #       803       0.096            0.092                115
  #      1333       0.077            0.081                 60
  #      1038       0.058            0.058                 51
  #
  # The 2026-07-30 factor of ~1.5 was measured in the pre-P1-P8 regime where PWID
  # HIV transmission was effectively zero and prevalence was a decaying seed
  # redistributing out of the Inj compartment; the gap between the denominators was
  # a property of that decay, not of the definitions. With transmission sustaining
  # the compartment, HIV+ agents are no longer concentrated among the recently-
  # stopped, and the look-back adds denominator and numerator in nearly equal
  # proportion. Swapping it would not move prevalence toward the target, so the
  # incidence cost it was being weighed against buys nothing. `pwid_recent` /
  # `pwid_recent_hiv` stay reported as an unscored diagnostic.
  #
  # WHAT THE PREVALENCE GAP ACTUALLY IS, same measurement: prevalence and incidence
  # are two readings of one equilibrium, and the front trades them off (Spearman
  # rho = -0.43 between hiv_prev_err and hiv_traj_rmse). Trials reproducing the
  # target-implied ~90 pooled infections land at 0.077-0.096 prevalence; trials at
  # 0.062 run 16-51 infections, at or under the transmission floor. Prevalence is
  # also flat across all 11 scored years in every trial (1165: 0.152 -> 0.159;
  # 803: 0.091 -> 0.083), i.e. it is set by the burn-in equilibrium and not
  # accumulated over the scored window -- note 1165 enters 2012 at 0.152 from a
  # 0.075 `hiv.init` seed. `initial_prevalence_pwid_2012` below is still never
  # applied as a constraint (CODE_REVIEW_2026-07-28 D9), so nothing pins the level
  # the burn-in hands to the scored window. That, not the denominator, is the open
  # question.
  #
  # SEPARATE, AND UNRESOLVED: every stratum in demographics carries
  # hiv.init = 0.075 for Inj and 0.0 for NonInj, identically across all six races
  # and all four sex types. Non-injecting agents therefore start with ZERO HIV --
  # including MSM, who carry most of RI's HIV -- so the model's total prevalence is
  # a seed that redistributes rather than an epidemic that sustains. It is also why
  # hiv_prev_inj falls 0.080 -> 0.019 while hiv_prev_noninj rises 0.000 -> 0.023
  # over a run: with transmission near zero, prevalence simply equilibrates across
  # compartments. Setting a non-zero NonInj seed (and race/sex_type differentiation)
  # needs RIDOH data -- this is citations GAP #27/#40 and must not be invented.
  hiv:
    baseline_prevalence_pct: 0.062          # APCD T3 PWID HIV prev (#25)
    initial_prevalence_pwid_2012: 0.075     # series-anchored initial condition
    incidence_series_years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
    incidence_series_per_pwid_yr: [0.0090, 0.0096, 0.0080, 0.0064, 0.0125, 0.0047, 0.0044, 0.0032, 0.0017, 0.0026, 0.0107]
    # Aggregation windows for hiv_traj_rmse, added 2026-08-03. The objective scores
    # period means, not the 11 annual points.
    #
    # WHY: measured 2026-08-03 over 20 Pareto members re-run at 5 pop seeds x 10
    # reps (job 4576015). Against the annual series every candidate scored WORSE
    # than a flat-at-mean predictor -- candidates 0.00426-0.00613, flat-at-mean
    # 0.00342 -- and 0 of 20 beat it. The 52/640 front members that appeared to
    # beat it at 10 reps all regressed. So the annual shape is not a thing the
    # model reproduces, and scoring it added error rather than signal.
    #
    # This SUPERSEDES the power analysis at the top of this file, which predicted
    # shape would resolve once the injection share was refit. That precondition
    # was met (share 0.11 -> ~0.45, pooled PWID ~1120), and shape still did not
    # resolve: between-trial SD of the objective was 0.00045 against a 0.00039 SE
    # on each trial's own mean. The prediction was about power to beat a flat
    # model; the failure is one of fit, which no amount of reps corrects.
    #
    # Periods are the ones the provenance note below already reports (T1 0.0083 /
    # T2 0.0053 / T3 0.0066) and match the APCD extraction's own era split.
    incidence_periods:
      - [2012, 2015]   # T1
      - [2016, 2020]   # T2
      - [2021, 2022]   # T3
    # 2014 value interpolated 0.0229 -> 0.0080 (mean of 2013/2015). Deep research 2026-07-13
    # (RIDOH HIV Surveillance Reports 2022/2023 + PMC6477915, PMC6055286, PMC5522175):
    # RI IDU-attributed HIV diagnoses stayed <6/yr across 2009-2023; the 2014 uptick was in
    # OVERALL (post-ACA testing) diagnoses, not PWID -> original 2.29% was a claims-proxy artifact.
    # NOTE: entire series is a claims (diagnosed-incidence) proxy; no RI PWID biological serosurvey exists.
    # T1=2012-2015 mean now 0.0083; T2=2016-2020 mean 0.0053; T3=2021-2022 mean 0.0066.
    #
    # PROVENANCE CAVEAT (deep-research pass 2026-07-21, see
    # docs/calibration_log/phase_4_ridoh_idu_validation_2026-07-21.md): this series is
    # an APCD claims proxy scoped to the OUD-diagnosed population (any transmission
    # route) per the Gu/Marshall 2025 protocol (PMC12400686), NOT RIDOH's
    # transmission-category-specific IDU classification. Kept as the optimization
    # target (no RI PWID population denominator exists to build a true per-PWID-year
    # IDU-specific rate — see ridoh_idu_validation below) but treat hiv_traj_rmse fits
    # with that caveat in mind.
    ridoh_idu_validation:
      # Superseded 2026-08-04 by ridoh_idu_dx below, which promotes these counts
      # from reference to optimization target. Kept for the citation trail; see
      # docs/calibration_log/phase_4_ridoh_idu_validation_2026-07-21.md.
      annual_count_range: [2, 9]   # observed low/high, RIDOH reports 2009-2023
      note: >
        RIDOH IDU-attributed new HIV diagnoses, RI: <6/yr (2009-2014), ~1.8/yr avg
        (2015-2019), 7 (2020), <5 (2022), 6 (2023); consistently 3-6% of all statewide
        diagnoses (~63-115/yr total), all years 2009-2023.

    # ============================================================
    # RIDOH IDU-attributed HIV diagnoses -- THE SCORED HIV TARGET
    # ============================================================
    # Replaces incidence_series_per_pwid_yr as the HIV objective, 2026-08-04.
    #
    # WHY THE SWAP. The APCD series was already known (2026-07-21) to be a
    # diagnosis proxy over a claims-identified OUD population on ANY transmission
    # route, not an injection-specific series. Job 4586902 showed what that costs.
    # Fitting it forces the model to 4-6x RIDOH's observed IDU-attributed
    # diagnosis counts, and the surplus transmission shows up as PWID HIV
    # prevalence of 13-16% against a 6.2% target. The two APCD targets are also
    # mutually infeasible: prevalence / incidence implies HIV+ agents dwell 9.4
    # years in the PWID compartment, against the model's 22.9 (p10 15.1, p90
    # 98.8), and no fitted parameter controls dwell time. That ratio is not a real
    # duration -- it divides two quantities built over different populations.
    #
    # The blocker to using RIDOH was always that its counts have no PWID
    # denominator. Scoring COUNTS rather than rates removes the need for one.
    #
    # DERIVATION, from RIDOH HIV/STI/Viral Hepatitis/TB Surveillance Reports
    # (2019, 2022 and 2024 editions, health.ri.gov). RIDOH publishes the IDU
    # share of newly diagnosed cases over 5-year pooled windows, and separately
    # the annual case totals. Counts below are share x known-exposure denominator.
    #
    #   window      IDU share   undetermined   known n   IDU cases   per year
    #   2015-2019      3%            50          ~300        ~9         1.8
    #   2018-2022      4%            38          ~312        ~12.5      2.5
    #   2020-2024      6%            43           312        ~19        3.7
    #
    # Only the 2020-2024 denominator (n=312) is published as text; the other two
    # are derived from the 2024 report's "from 2015-2023 ... an average of 70
    # cases per year" minus that window's undetermined count. The 2015-2019 value
    # independently reproduces the 2019 report's own "~9 total (~1.8/yr)", which
    # is the cross-check that makes the derivation usable.
    #
    # The 2024 report states 5.3% "attributed strictly to IDU" over 2020-2024,
    # which against 312+43=355 gives 18.8 cases -- agreeing with the 6%-of-312
    # figure of 18.7. Two independent statements, same answer.
    #
    # SHAPE. IDU-attributed diagnoses are flat-to-RISING across the window
    # (1.8 -> 2.5 -> 3.7 per year). The APCD series being replaced has a 36%
    # T1->T2 DECLINE. The long-standing "model cannot reproduce the trajectory
    # shape" finding -- 0/8 seeds on every candidate in job 4642405 -- was the
    # model refusing to reproduce a decline that RIDOH says did not happen in
    # IDU-attributed cases.
    #
    # WHAT THE MODEL SIDE MUST BE. RIDOH's category comes from case-investigation
    # risk-factor interviews and counts only infections attributed to injection.
    # `hiv_new` among PWID is NOT that quantity: measured 2026-08-04, only ~31%
    # of new infections among PWID are injection-acquired, the rest arriving by
    # the sexual and background routes that went live in P1-P8. The comparable
    # model quantity is `hiv_dx_new_inj` -- diagnoses, injection-acquired --
    # added to titan/exposures/hiv.py the same day.
    ridoh_idu_dx:
      # Cases per year, statewide, attributed strictly to IDU. GBMSM/IDU
      # dual-risk is a SEPARATE RIDOH category (6%/10%/9% over the three windows)
      # and is deliberately excluded: those infections are not attributed to
      # injection by RIDOH, and the model counts them under the sexual route.
      windows:
        - years: [2015, 2019]
          cases_per_year: 1.8
        - years: [2018, 2022]
          cases_per_year: 2.5
      # Windows overlap on 2018-2019 because that is how RIDOH pools. Both are
      # scored; the overlap double-weights those two years, which is accepted
      # rather than corrected -- inventing a de-overlapped series would mean
      # inventing annual values RIDOH suppresses.
      #
      # 2012-2014 has no published window. PMC6055286 bounds IDU-attributed
      # diagnoses at <6/yr across 2009-2014, carried here as a one-sided
      # constraint: no penalty below it, penalised above.
      upper_bound_pre_2015:
        years: [2012, 2014]
        max_cases_per_year: 6.0
      # Single-year values are suppressed by RIDOH below 5 ("fewer than 5 ... in
      # 2024", "less than five ... in 2022"), so an annual series cannot be built
      # and is not attempted.

    # ALL new HIV diagnoses among people who inject drugs, whatever the route.
    # Added 2026-08-04, scored in the same objective slot as ridoh_idu_dx.
    #
    # WHY THIS EXISTS. ridoh_idu_dx alone constrains one route. Measured on the
    # 2026-08-04 front, the model's HIV module runs 1.8-4.8x above RIDOH on ALL
    # diagnoses among PWID while `calibration.acquisition` scales every route at
    # once -- injection, sex and background alike. With only the IDU objective in
    # play, the cheapest way for the optimizer to hit it is to crush
    # partnership.injection.transmission.base and leave the global scalar high:
    # IDU counts land on target, sexual and background transmission stay several
    # times too hot, and the injection route -- the one every planned
    # intervention acts on -- goes inert. The objective would look better than
    # the model. Scoring both series together closes that.
    #
    # DERIVATION, same three RIDOH surveillance reports as ridoh_idu_dx. RIDOH
    # splits people who inject drugs across TWO exposure categories: `IDU`
    # (attributed to injection) and `MSM/IDU` (called GBMSM/IDU from the 2022
    # edition) for men who both inject and have sex with men, whose route is not
    # resolved. Their sum is diagnoses among people who inject, all routes.
    #
    #   window      IDU   MSM/IDU   sum   known n   cases   per year
    #   2015-2019    3%      6%      9%     ~300      27       5.4
    #   2018-2022    4%     10%     14%     ~312      43.7     8.7
    #   2020-2024    6%      9%     15%      312      46.8     9.4
    #
    # Denominators and their cross-check are documented under ridoh_idu_dx.
    #
    # This also anchors the route MIX, which nothing else in the objective does.
    # RIDOH's injection-attributed share of PWID diagnoses is IDU/(IDU+MSM/IDU) =
    # 33% / 29% / 40% across the three windows. The model measured 47.7% on
    # 2026-08-04, so it is modestly injection-heavy -- the injection route needs
    # to come down somewhat MORE than the sexual route, which is not what the
    # IDU-only objective would have implied.
    #
    # CAVEAT: IDU + MSM/IDU is a LOWER BOUND on diagnoses among people who
    # inject. RIDOH assigns a case by presumed route, so someone who injects but
    # whose infection was attributed to heterosexual contact lands in the
    # heterosexual category instead. Scoring it two-sided therefore biases the
    # model slightly low. That is accepted while the model sits 2-5x ABOVE the
    # target; revisit if a refit brings it close.
    #
    # OPIOID ADJUSTMENT, 2026-09-29 (Jun, option 1). The model is an opioid use
    # disorder cohort; RIDOH's MSM/IDU category counts any injection drug use.
    # In NHBS-PWID (2012 and 2015 cycles, n = 961 MSM who inject), 33.7% reported
    # methamphetamine as the drug injected most often (Drug Alcohol Depend 2018,
    # PubMed 30055426). The scored all-route windows are therefore
    #
    #     IDU + (1 - stimulant_share_of_msm_idu) x MSM/IDU
    #
    # derived by build_targets() from `parts`, so the parts and the scored
    # number cannot drift apart. 0.34 is conservative (NHBS-PWID recruits mostly
    # through opioid-injecting networks); sensitivity 0 and 0.5. Grid 4 (job
    # 6830581) showed the unadjusted 8.7/yr unreachable with the non-injecting
    # MSM compartment at a plausible ~0.2 prevalence (solve at 98x), and the
    # adjusted target reachable inside the box. `windows` below keeps the
    # unadjusted RIDOH record; the objective reads the derived values.
    ridoh_pwid_dx_all_routes:
      stimulant_share_of_msm_idu: 0.34
      parts:
        - years: [2015, 2019]
          idu: 1.8
          msm_idu: 3.6
        - years: [2018, 2022]
          idu: 2.5
          msm_idu: 6.2
      windows:
        - years: [2015, 2019]
          cases_per_year: 5.4
        - years: [2018, 2022]
          cases_per_year: 8.7
      # 2020-2024 (9.4/yr) is not scored: the model horizon ends in 2022, so the
      # window is only half covered. Recorded as a forward check.
      forward_check:
        years: [2020, 2024]
        cases_per_year: 9.4

    # Model-to-Rhode-Island population scale, needed to compare model case counts
    # against statewide surveillance counts.
    #
    # The model population is an OUD cohort -- oud_baseline.oud_none is 0.0 -- of
    # `population.size` agents, of which oud_baseline.oud_active are active. APCD
    # counts 13,704 distinct RI members with any F11.* diagnosis in the T3 average
    # year (RI_parameter_verification_APCD.md #39), which is the same population
    # the MOUD objective's denominator is defined against, so it is the consistent
    # anchor for `oud_active`.
    #
    # scale = 13704 / (oud_active_fraction x population.size) = 13704 / 275 = 49.8
    #
    # NOT PROFOUND's 63,131 "at-risk" figure (PWID + non-injection OUD, cited at
    # RI_parameters_citations.md #7). That is a wider population than oud_active
    # and would put the scale at 126x, i.e. 2.5x every model count. Using it would
    # be defensible only if the model's compartment were redefined to match it.
    population_scale:
      ri_active_oud: 13704
      source: "APCD #39, T3 average, distinct members with any F11.* dx in year Y"

  # --------------------------------------------
  # VALIDATION TARGETS -- NOT SCORED
  # --------------------------------------------
  # Added 2026-07-29. These are directly observable quantities that the model
  # takes as data-anchored INPUTS rather than fitting. They are checked so a
  # parameterisation that drifts away from them is visible, but deliberately kept
  # out of the objective: fitting an observable would spend search dimensions on
  # something already measured and let the optimizer hide error from elsewhere in
  # a quantity we can independently check.
  #
  # Until this block existed, neither incarceration nor the HIV care cascade was
  # constrained by anything at all -- the same failure mode that let the injection
  # share drift unnoticed. See EPIDEMIC_DYNAMICS_AUDIT_2026-07-29b.md.
  validation_targets:

    incarceration:
      # RIDOC CY2024 commitments (8,076 awaiting-trial / 2,540 sentenced) with
      # spells <= 7 days dropped and the entry hazard rescaled by the 60% retained
      # -- the monthly timestep cannot represent a 2-day hold, and rounding one up
      # to a full month overstates person-time by ~24%. Dropping them instead
      # holds the error to +6.5%.
      concurrent_share: 0.0552          # steady-state share incarcerated
      concurrent_tolerance: 0.015
      annual_entry_gt7d: 0.192          # P(>=1 spell > 7 days in a year)
      mean_spell_months: 3.32
      note: >
        Cross-check: the retained mixture implies a 56-day mean spell across ALL
        commitments, against 53 days observed in the RI incarcerated-MOUD cohort
        (4,731 episodes). P(spell > 12 mo) 1.9% modelled vs 2.8% observed.

    hiv_cascade:
      # CDC NHBS-PWID 2024 / NHSS 2024, national PWID. RIDOH publishes a statewide
      # continuum (76.4% engaged, 71.9% suppressed) but does not stratify it by
      # PWID, and the PWID-specific national figures are substantially worse than
      # the statewide all-PLWH ones -- so the national PWID numbers are the base
      # case and the RI statewide figures are an optimistic upper-bound scenario.
      #
      # These are MARGINAL proportions from different surveillance designs; they
      # must not be multiplied sequentially. suppressed_given_art is a derived
      # approximation (0.572 / 0.780), not a measured conditional.
      linked_within_1mo: 0.802
      art_among_dx: 0.780
      art_tolerance: 0.06
      suppressed_among_dx: 0.572
      suppressed_given_art: 0.733
      suppressed_tolerance: 0.08
      ri_statewide_upper_bound: 0.72    # optimistic scenario, not the base case
      note: >
        dx_among_hiv is deliberately NOT given a target here. The model saturates
        it at 0.97-1.00 against a real-world figure nearer 0.85-0.90, and that is
        an open defect in hiv_testing (audit finding F7), not a parameter to fit.

    background_foi:
      # Added 2026-07-30 when hiv.background_sex.per_act_transmission_prob was
      # removed from parameters_to_optimize (audit F9). The exogenous route is
      # structurally necessary -- the modelled population is 100% ever-OUD
      # (init_none = 0), so sex with non-OUD partners cannot be a partnership --
      # but it must be an INPUT. Its per-act probability is now read from
      # partnership.sex.acquisition, the same table the network route uses,
      # because it is the same biological quantity. What remains are two
      # mixing inputs, and BOTH are unsourced:
      #
      #   hiv.background_sex.rate_nonoud_per_timestep       = 0.5   GAP
      #   hiv.background_sex.partner_hiv_prevalence_nonoud  = 0.01  GAP #27
      #   hiv.background_sex.inj_multiplier                 = 1.5   GAP
      #
      # partner_hiv_prevalence_nonoud = 0.01 is ~4x RI's general adult HIV
      # prevalence (~0.0025). Assortative mixing justifies some excess, but not
      # an unstated factor of four, and the value is doing real work: it is a
      # linear multiplier on the entire exogenous route.
      max_exogenous_incidence_share: 0.25
      note: >
        Diagnostic, not a fitted quantity. In the post-rebuild run 12 of 21
        infections (57%) arrived through the exogenous route, versus 2 by network
        injection and 7 by network sex. That is the one route no modelled
        intervention can touch, so a model in that regime will understate every
        scenario effect no matter how well it fits the calibration targets. If a
        refit lands above this share, the exogenous inputs are wrong, not the
        network parameters. Measure with
        analysis/oud_feasibility_2026-07-30/probe_denominator.py.

    hiv_testing:
      # Added 2026-09-29 with the pinning of hiv_testing.base_prob_annual, so the
      # pin is checkable against the survey it came from. NHBS-PWID: 45% (2022)
      # and 48% (2024) of PWID tested for HIV in the past year. The model
      # reports TESTS per PWID person-year (hiv_tests_per_pwid_yr); with lambda
      # tests per person-year the share tested at least once is about
      # 1 - exp(-lambda), so 0.45 <-> 0.60 and the +/-0.10 survey band <-> 0.43-0.80.
      tests_per_pwid_yr: 0.60
      tolerance: 0.18
      share_tested_past_year: 0.45      # the survey quantity the rate above encodes

    overdose_fatal:
      # The fatal rate left od_err on 2026-09-29 (see the overdose block above);
      # it is checked here instead. With overdose.fatal_frac derived from the
      # targets a miss means the nonfatal rates missed, not the fraction.
      fatal_rate_annual: 0.015
      tolerance: 0.003

    noninj_msm_hiv:
      # Added 2026-09-29. The HIV grid (jobs 6812107, 6817937) showed the model
      # can reach RIDOH's all-route PWID diagnosis level while its non-injecting
      # MSM compartment sits at 0.4-0.8 HIV prevalence -- the sexual route into
      # PWID fed by an overheated 5% subpopulation. RIDOH 2022: about 6-7% of RI
      # GBMSM are living with HIV (GBMSM denominator ~26,500 from the per-100k
      # new-diagnosis rates); among MSM who use drugs, NHBS-style samples run
      # 0.15-0.25. A fit above 0.30 reached the target through the wrong
      # reservoir. Reported as hiv_prevalence_noninj_msm; never scored.
      # Re-sourced 2026-09-29: band 0.05-0.25. Floor ~7% of RI GBMSM living
      # with HIV (RIDOH 2022); ceiling 25% among MSM who inject (NHBS-PWID
      # 2018, CDC MMWR 2021;70(42):1459-65), which non-injecting MSM with OUD
      # should not exceed. Was 0.20 +/- 0.10 with a thinner source.
      prevalence: 0.15
      tolerance: 0.10

  # --------------------------------------------
  # PARAMETERS FIXED FROM DATA (not searched) -- 2026-09-29
  # --------------------------------------------
  # Applied by optuna_calibration.set_anchored_parameters() after the suggest
  # loop, at every site that materialises a runnable scenario, and guarded by
  # assert_not_fitted(): a path listed here AND in parameters_to_optimize is a
  # startup error. The engine's own parameter files still carry defaults for
  # these paths; the values below override them for every calibration run and
  # for the canonical scenario.
  #
  # Tiers 1-2 of docs/calibration_log/phase_6_parameter_audit_2026-09-01.md,
  # decided 2026-09-29. Each was worth < 0.005 of holdout R^2 on every objective
  # in job 5569988 -- fitted in name, randomised in fact -- and each has either a
  # measurement or a derivation. The uncertainty in each belongs to the
  # sensitivity analysis (ranges noted per entry), not to a search dimension.
  #
  # overdose.fatal_frac is NOT listed: it is derived from the overdose targets by
  # derived_fatal_frac() and written alongside these. See the overdose block.
  anchored_parameters:

    # NHBS-PWID past-year testing 45% (2022) / 48% (2024): a person tested at
    # least once in a year at lambda tests/yr is 1 - exp(-lambda), so 45% is
    # lambda = 0.60 tests per PWID-year (validation_targets.hiv_testing).
    #
    # RE-DERIVED 2026-09-30. The first pin, 0.155 = 0.45 / pwid_mult 3.0, divided
    # by only one of the multipliers hiv_testing.py stacks on the base rate:
    # ~80% of this cohort's PWID are on MOUD (moud_stable_mult 1.5, early 3.0),
    # plus the high-risk, post-relapse and post-overdose windows. The pilot
    # refit (job 6832656, 200 trials) measured the composite: 1.14 tests per
    # PWID-year at base 0.155 (p10-p90 1.02-1.24), i.e. an effective multiplier
    # of 7.35 (6.6-8.0), and the diagnosed share sat at 0.967 against RIDOH's
    # 0.932. base = 0.598 / 7.35 = 0.081. Cross-check: probe_seed_burn's
    # dose-response (block above) puts the diagnosed share near 0.92 at this
    # value. Sensitivity 0.07-0.09 (the p10-p90 of the multiplier). Scenario 5
    # multiplies this baseline. Was fitted in [0.05, 0.20], worth 0.0003 of R^2
    # on the best objective it touched.
    - path: "hiv_testing.base_prob_annual"
      value: 0.08
      source: "NHBS-PWID 45% tested/yr = 0.60 tests/PWID-yr, / measured composite multiplier 7.35 (pilot job 6832656); citations row #28"

    # No extra post-overdose MOUD uptake beyond the ordinary re-engagement rate.
    # The 2026-09-01 audit proposed deriving this so 30% of survivors are on
    # medication within 12 months (Larochelle 2018; RI APCD job2b 26-31%). That
    # is not reachable: at the reinit_prob the coverage series needs (~0.36/mo
    # against discontinuation 0.078), an ever-on survivor restarts within 12
    # months with probability ~0.99 at rr = 1.0 already. What the model CAN be
    # held to is the 30-day figure -- RI 13-20% within 30 days (job2b) against
    # the model's ~20-36% per month for ever-on agents -- and rr > 1 only moves
    # it further off. 1.0 is the least-wrong value and the box floor; the
    # overshoot is a limitation to state, and the 12-month linkage among
    # survivors is a diagnostic still to add. Scenario 2's lever: its arm value
    # is target linkage / fitted reinit_prob.
    - path: "moud.post_overdose_rr"
      value: 1.0
      source: "Larochelle 2018 (30% at 12 mo) unreachable at any rr; RI APCD job2b 30-day 13-20% bounds it at 1.0"

    # RI PDMP buprenorphine 12-month retention 37.8% (Hallowell; citations row
    # #9): 1 - 0.378^(1/12) = 0.0779. The 6-month figure (45%) implies 0.124 and
    # the RI cascade 0.069; retention hazards fall with time on treatment and
    # methadone retains better than buprenorphine, so a single constant is a
    # compromise. 0.078 is the direct RI measurement over the horizon the
    # coverage series spans. Sensitivity 0.069-0.124. Second-strongest lever on
    # moud_traj_rmse (0.242 of R^2): pinning it means reinit_prob carries the
    # MOUD objective alone, which is why its upper bound moved to 0.50.
    - path: "moud.discontinue_per_month"
      value: 0.078
      source: "RI PDMP 12-mo buprenorphine retention 37.8%, citations row #9"

    # Overdose risk while on MOUD relative to off, applied to every overdose
    # event (fatal and nonfatal alike, since the fatal roll is separate).
    # Confirmed by literature search 2026-09-29 (Jun's request):
    #   Sordo 2017, BMJ 357:j1550 -- overdose mortality in vs out of treatment,
    #     methadone 2.6 vs 12.7 per 1000 PY (RR out/in 4.80, 2.90-7.96, i.e.
    #     0.21 in/out), buprenorphine 1.4 vs 4.6 (0.30).
    #   Santo 2021, JAMA Psychiatry 78(9):979 -- meta-analysis, RR during vs
    #     out of OAT: unintentional drug-induced deaths 0.41 (0.33-0.52),
    #     unintentional opioid deaths 0.31 (0.23-0.43), all-cause 0.47.
    #   Wakeman 2020, JAMA Netw Open (claims, any overdose, intention to treat):
    #     aHR 0.24 (0.14-0.41) at 3 months, 0.41 (0.31-0.55) at 12 months --
    #     ITT includes people who stopped, so an upper bound on the on-treatment
    #     effect the model applies.
    #   Pearce 2020, BMJ 368:m772 (BC, fentanyl era): all-cause off/on 2.6-3.4,
    #     i.e. 0.29-0.38 on/off.
    # Every estimate sits in 0.21-0.41; 0.30 is buprenorphine's on/off value
    # and the centre of the range, and RI's MOUD mix is majority buprenorphine.
    # Sensitivity 0.21-0.41. The 2026-08-11 box [0.316, 0.70] excluded most of
    # this evidence, and the fitted 0.55-0.61 on the shortlist trials sat above
    # all of it.
    - path: "moud.overdose_scale.active"
      value: 0.30
      source: "Sordo 2017 (0.21 methadone, 0.30 buprenorphine); Santo 2021 (0.31-0.41); Wakeman 2020 ITT (0.24-0.41); Pearce 2020 (0.29-0.38)"

    # Overdose risk multiplier during the post-release high-risk window
    # (titan/features/high_risk.py: an agent is high_risk for
    # high_risk.duration = 6 steps after release from incarceration, and 20%
    # of agents start in that state). Merrall 2010 (Addiction, meta-analysis of
    # post-release drug-related death): weeks 1-2 carry 3-8x the rate of weeks
    # 3-12, with weeks 3-12 themselves still elevated. Averaged over a 6-month
    # window against the long-run off-MOUD baseline -- ~5x for 2 weeks, ~1.5x
    # for weeks 3-12, ~1.2x for months 4-6 -- the multiplier is about 1.6.
    # CITATION TO VERIFY against the paper's pooled estimates before the
    # methods are written; the model is insensitive to it (0.003 of R^2 on the
    # best objective) and no Phase 7 arm touches incarceration. Sensitivity
    # 1.2-2.5. Citations row #20's RIDOC evidence (Green 2018, Macmadu 2023) is
    # about MOUD blunting this spike, not its size.
    - path: "overdose.high_risk_mult"
      value: 1.6
      source: "Merrall et al. 2010 post-release drug-related death, time-averaged over the 6-step window; verify"

    # Share of relapses that return to injection among people who previously
    # injected. GAP #6, no clean source. Fixed at the scenario's 0.5 because
    # that is the value the C2 stationarity probe (job 5568xxx series,
    # phase_6_c2_injection_share_2026-08-24.md) measured the model's own
    # steady-state injection share at: 0.305-0.313 against the RIHRSS 0.32
    # anchor, i.e. the anchor is already met at this value to within a point.
    # Its only leverage was on inj_share_err, which is no longer scored
    # (0.034 of R^2 on the live objectives). Sensitivity 0.43-0.85, the old box.
    - path: "oud_state.transitions.relapse_to_inj_prob"
      value: 0.5
      source: "model steady state 0.305-0.313 vs RIHRSS 0.32 at this value (C2, 2026-08-24)"

  # --------------------------------------------
  # PARAMETERS TO BE CALIBRATED (wide ranges per user direction)
  # --------------------------------------------
  # NINE SINCE 2026-09-29, from sixteen. The seven that left are listed under
  # anchored_parameters above (six) and derived_fatal_frac() (one). The nine
  # that remain: the three OUD transition rates without data (remission,
  # relapse), moud.reinit_prob (the most identifiable of the sixteen and
  # scenario 3's lever), moud.injection_scale.active, the two overdose base
  # probabilities (kept fitted rather than converted by hand from the targets,
  # because the conversion runs through the MOUD, high-risk, relapse and SSP
  # multipliers and the scoring window -- exactly what the objective does
  # exactly), and the three network/transmission levers injection.act,
  # partner_scale and -- since later on 2026-09-29, in place of sex.act --
  # background.msm_inj_mult, the outside exposure of MSM who inject.
  parameters_to_optimize:

    # ================================================================
    # BOUNDS REBASED 2026-08-11 ONTO THE HIV/OVERDOSE INTERSECTION BOX
    # ================================================================
    # Every `lower`/`upper` below that carries a "refit box 2026-08-11" comment
    # was narrowed from job 4830724's front. The original bound and its original
    # provenance comment are preserved inline, and the full priors are recoverable
    # from git history (parent of this commit).
    #
    # WHY. Job 4830724 ran 1000 trials x 40 reps and cleared the RIDOH HIV gate
    # for the first time (best ridoh_hiv_err 0.359 against a 4.782 null). But
    # against the real gates in validate_candidates.OBJECTIVES the pass counts
    # were oud 361, hiv 39, od 37, moud 443, inj 195 -- and hiv AND od together
    # was ZERO. Every other pair was non-empty.
    #
    # That zero is NOT a structural conflict, which is the whole basis for this
    # change. corr(od_err, hiv_err) = -0.019 over all 1000 trials. At P(hiv)=0.039
    # and P(od)=0.037 independence predicts 1.44 joint trials in 1000, and
    # P(observing 0 | lambda=1.44) = 0.24. Zero is an ordinary draw.
    #
    # Taking p10-p90 of the HIV-passing set and of the OD-passing set, the two
    # regions OVERLAP IN ALL 18 DIMENSIONS. That intersection is 1.05e-06 of the
    # original prior box, which predicts 0.001 uniform hits per 1000 trials --
    # and indeed none of the 1000 trials landed inside it. NSGA-II spreads along
    # a 5-objective Pareto front; it never sampled the joint-gate corner. Half the
    # run (499/1000) went to trials scoring worse than a zero-transmission model.
    #
    # The bounds below are the p5-p95 version of that intersection, padded 10% of
    # its own width on each side and clipped to the original priors. That is
    # 2.66e-04 of the prior box: 252x LARGER than the raw p10-p90 intersection, so
    # a single tight marginal cannot exclude the optimum, and still 3766x smaller
    # than what job 4830724 searched.
    #
    # CAVEAT, and it is the reason this is a hypothesis rather than a result:
    # overlapping MARGINALS do not prove a jointly-feasible POINT exists.
    # Correlations inside the box could still empty it. The near-zero od/hiv
    # correlation is evidence against that, not proof. If this run also returns
    # zero 5-of-5 candidates, the conclusion IS structural and the response is a
    # targets conversation, not another rebound.
    #
    # WATCH THE OVERDOSE BOUNDS. base_prob_inj now starts at 0.1135 and
    # base_prob_noninj at 0.0563, both ABOVE the APCD anchors quoted in their own
    # inline comments (#17 T3 = 0.091, #18 T3 = 0.045). These are per-timestep
    # probabilities rather than the annual rates those anchors state, so they are
    # not directly comparable -- but the OD-passing region sitting entirely above
    # the cited anchors is worth confirming rather than assuming. fatal_frac is
    # the most aggressive cut in the set, [0.1755, 0.2102] against a [0.05, 0.25]
    # prior, 17% of its original width.
    #
    # See docs/calibration_log/ and the job 4830724 journal archived under
    # calibration_archive/job_4830724/ for the derivation inputs.
    #
    # `inject_relapse_window_years` is deliberately NOT in this list. The recency
    # mechanism is merged and inert (default 999 years, verified byte-identical to
    # the old ever_injected latch); activating it changes injection dynamics and
    # therefore the PWID denominator, which would invalidate this box. Fit it
    # separately before the scenario stage.

    # ---- OUD natural history (oud_state.py) ----
