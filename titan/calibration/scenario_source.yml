  # <<< care_seeking <<<
  sdh:
    # Social determinants as agent state (2026-10-24, work record §19.39; proposal Table 2). Hardship index =
    # count of current homelessness, food insecurity, unemployment on one latent (rho); sex work on the same latent.
    # Every marginal is a POINT prevalence (a state is on or off this month; episodes end at 1/12 per month), so
    # past-12-month survey values are converted with analysis/sdh_evidence_2026-10-25/pastyear_to_point.py
    # (rho 0.35, q 1/12): past-year 0.65 -> 0.50, 0.60 -> 0.45, 0.51 -> 0.37, 0.31 -> 0.21, 0.20 -> 0.12,
    # 0.10 -> 0.057, 0.08 -> 0.046, 0.05 -> 0.027. Values set 2026-10-25 from Rhode Island and public data
    # (work record §19.45; the 2026-10-24 NHBS street-sample values put about 4,400 cohort members homeless,
    # three times everyone homeless in Rhode Island on the HUD count night):
    # housing = current homelessness: TEDS-A 2022 RI primary-opioid admissions 15.5 % injecting / 6.9 %
    #   non-injecting homeless at admission (upper end: admissions over-count people who cycle through treatment);
    #   RIDOH SUDORS 2020-22 5.4 % of opioid decedents (doi:10.1097/ADM.0000000000001502) -> cohort 1.9-3.7 %;
    #   HUD CoC RI-500 point-in-time 2018-22: 1,055-1,577 people, 131-326 adults with chronic substance abuse.
    #   0.10 / 0.04 (ranges 0.05-0.155 / 0.02-0.07).
    # employment = unemployed (looking for work or laid off): TEDS-A 2022 RI primary-opioid admissions 49.2 %
    #   injecting / 37.2 % non-injecting (point); upper values, the claims cohort holds more private insurance.
    # food = food insecurity, past-year screeners converted to point: 51 % starting buprenorphine in primary care
    #   (doi:10.1177/2150132720932017), 64.8 % / 66.9 % among people who inject (doi:10.1111/add.15151,
    #   doi:10.1080/10826084.2020.1762653) -> 0.47 / 0.37. Literature tier, no Rhode Island source.
    # rho 0.35 from NHBS 2018 (unemployed 57 % vs 34 % by housing). Episodes end at 1/12 per month (mean one
    # year, ASSUMED). Effects per index point: MOUD discontinuation x1.2 (unstable housing: 90-day retention OR
    # 0.59, Damian 2017; cessation HR 1.09, Bharat 2021), PrEP discontinuation x1.2 (qualitative; Guy 2022
    # review), ART non-adherence x1.15 / re-adherence x0.85 (food insecurity: viral suppression OR 0.71,
    # Aibibula 2017).
    # Sex work (exchange sex; past-year sources converted to point, §19.45): treatment-seeking people with OUD
    # 24.9 % lifetime transactional sex, women 33.4 % (doi:10.1016/j.amepre.2022.07.011); men who use opioids
    # 10.7 % in the past three months (doi:10.1186/s12954-022-00697-3); NHBS-PWID street samples (women 0.31,
    # MSM 0.35) are the upper end. Point values: women who inject 0.12 (past-year 0.20), non-injecting women
    # 0.057 (0.10); other men 0.046 / 0.027 (0.08 / 0.05); MSM 0.23 / 0.057 (0.35 / 0.10). The PrEP indication
    # reads sex work in the past prep_indication_months months (12: the NHBS item and the CDC indication), not
    # the current state. partner_mult 1.5 ASSUMED from the shift in partner numbers (4+ condomless partners
    # 7.5 % vs 0.7 %, women), relative within sex type x injecting status (mean-preserving, 2026-10-25); condom
    # use unchanged (NHBS). Sensitivity: marginals at odds x0.5 / x2, multipliers x0.5 / x2 on the log scale,
    # mean_preserving false.
    hardship:
      rho: 0.35
      episode_end_prob_per_month: 0.0833
      prob_inj: {housing: 0.10, food: 0.47, employment: 0.49}
      prob_noninj: {housing: 0.04, food: 0.37, employment: 0.37}
      # Component-specific multipliers (2026-10-25, work record §19.46; registry "SDH as agent state"): the agent's
      # multiplier is the product over its components of m_c, mean-preserving within the group the hook acts on.
      # Where two components act on one behaviour the m_c were solved so the model's crude ratio by component
      # reproduces the source (analysis/sdh_evidence_2026-10-25/component_multipliers.py). 1.0 = no evidence.
      # Care: housing -> methadone discontinuation AHR 1.42 (doi:10.1016/j.drugalcdep.2018.01.027), MOUD
      # retention OR 0.709 (TEDS-D), solved with unemployment (one-year buprenorphine retention OR 0.72) to HR
      # 1.40 / 1.23 -> 1.319 / 1.207; food -> PrEP non-adherence aPR 1.47 (doi:10.1002/jia2.70070); ART from
      # viral-suppression ORs 0.38 homeless (US meta-analysis, doi:10.1007/s10461-026-05177-4) and 0.71 food
      # insecure (Aibibula 2017), split evenly between losing and regaining adherence.
      care_mult:
        housing: {moud_discontinue: 1.319, prep_discontinue: 1.0, art_nonadherence: 1.556, art_readherence: 0.643}
        food: {moud_discontinue: 1.0, prep_discontinue: 1.47, art_nonadherence: 1.146, art_readherence: 0.872}
        employment: {moud_discontinue: 1.207, prep_discontinue: 1.0, art_nonadherence: 1.0, art_readherence: 1.0}
      # Risk (Jun, 2026-10-24: the determinants must reach behaviour and HIV): housing -> receptive sharing aPR
      # 1.26 (NHBS 2018), non-fatal overdose AOR 1.57 (doi:10.1016/j.drugpo.2023.104117; NHBS aPR 1.64) -> 1.6,
      # injection initiation 1.3 (range 1.0-2.5): below the street-youth AHRs for homelessness, 1.68 boys / 2.49
      # girls (doi:10.1016/j.drugalcdep.2010.09.003), no adult estimate (the Vancouver AOR 1.28 is for daily cocaine
      # injection among injectors, not initiation; verified 2026-10-25); food -> condomless sex 1.5
      # (severe food insecurity aOR 2.68, doi:10.1097/QAD.0b013e32834b35c9; null elsewhere). Sensitivity x0.5 /
      # x2 on the log scale, and mean_preserving false as a structural sensitivity.
      risk_mult:
        housing: {sharing: 1.26, condomless_sex: 1.0, inject_start: 1.3, overdose: 1.6}
        food: {sharing: 1.0, condomless_sex: 1.5, inject_start: 1.0, overdose: 1.0}
        employment: {sharing: 1.0, condomless_sex: 1.0, inject_start: 1.0, overdose: 1.0}
      mean_preserving: true
