# Source of truth for calibrated_scenario_multi_5obj.yml.
#
# Edit THIS file, then run `python scripts/make_scenario.py`. Do not edit the
# generated scenario -- `make_scenario.py --check` fails if it has been touched,
# and the next regeneration would discard the edit silently.
#
# WHY: the generated artifact is 2,774 leaf values, 95% of them in `demographics`,
# where 111 of 124 leaf paths hold one Rhode Island number written once per
# demographic cell -- 48 times over. Storing a value in 48 places is how values
# drift apart from each other, which this project has paid for more than once
# (`set_population_window()` inert for two days; `model.seed.ppl` unread across
# four refits; `Inj.ppl` and `injecting_pct` disagreeing by 2026-08-13). Here each
# value has exactly one home. See
# docs/calibration_log/phase_6_scenario_format_2026-08-17.md.
#
# STRUCTURE. `demographics` has one entry per nesting level of the scenario --
# `race`, `sex_type`, `drug_type`. Each carries:
#
#   constants:  values identical in every cell at that level, written once
#   varying:    one entry per value that genuinely differs, as
#                 - path:   dotted path within the cell
#                   by:     the axes it varies along (race / sex / drug)
#                   values: nested dict keyed by those axes, in `by` order
#
# `by` is the SMALLEST set of axes on which the value is a well-defined function,
# so an entry listing two axes is claiming genuine two-way structure. The sentinel
# "__absent__" means the path does not exist in that cell -- the cross-product is
# ragged, and a NonInj agent legitimately has no `Inj` or `SexInj` partnership
# block.
#
# NOT HERE: the sampling design. `model.num_pop`, `model.time.*` and
# `model.seed.ppl` are DERIVED from `calibration.population` in
# calibration_targets.yml when the scenario is generated, because they were
# previously stated in both places at once and `burn_steps` drifted apart in
# exactly that gap. Change them there.
#
# PROVENANCE AND CITATIONS. Parameter sourcing lives in
# `RI_parameters_citations.md` and `RI_parameter_verification_APCD.md`; the record
# of what was tried and refuted lives in the comments of
# `titan/calibration/calibration_targets.yml`. Values the calibration fits or
# anchors at runtime are applied by `optuna_calibration.py`'s `set_*` functions and
# will overwrite whatever is written here.
#
# This file was generated once by `make_scenario.py --extract-from`, which
# rewrites it wholesale and would drop these comments. That flag is a migration
# tool, not part of the normal loop.

