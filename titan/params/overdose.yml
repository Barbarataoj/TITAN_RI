# =========================
# OVERDOSE PARAMETERS
# =========================
overdose:

  base_prob_inj:
    default: 0.02
    description: |
      Base ANNUAL overdose probability for OUD agents
      with injecting drug use (drug_type = Inj).
      Converted to per-timestep risk internally.
    type: float
    min: 0.0
    max: 1.0

  base_prob_noninj:
    default: 0.01
    description: |
      Base ANNUAL overdose probability for OUD agents
      with non-injecting drug use (drug_type = NonInj).
      Converted to per-timestep risk internally.
    type: float
    min: 0.0
    max: 1.0

  fatal_frac:
    default: 0.15
    description: |
      Fraction of overdose events that are fatal
      and trigger exit via exit_enter.
    type: float
    min: 0.0
    max: 1.0

  high_risk_mult:
    default: 2.0
    description: |
      Multiplier on overdose risk for agents
      flagged as high_risk.
    type: float
    min: 0.0
    max: 100.0

  ssp_rr:
    default: 0.8
    description: |
      Relative overdose risk for agents actively enrolled
      in syringe services / naloxone.
      Values < 1 reduce risk.
    type: float
    min: 0.0
    max: 10.0

  post_relapse_od_rr:
    default: 2.0
    description: |
      Multiplier on overdose risk during the elevated-risk
      window following relapse from remission,
      reflecting loss of opioid tolerance.
    type: float
    min: 1.0
    max: 10.0

  post_overdose_window:
    default: 6
    description: |
      Number of timesteps after a nonfatal overdose during which the
      `recent_overdose` flag remains True (used by MOUD uptake and HIV
      testing multipliers). Default ~6 months at monthly timestep.
    type: int
    min: 0
    max: 120

  post_moud_stop_rr:
    default: 1.0
    description: |
      Multiplier on overdose risk in the window immediately after an agent
      stops MOUD (loss of opioid tolerance), applied on top of the ordinary
      off-MOUD risk while the agent's `recent_moud_stop` flag is set. The
      flag is raised by the moud feature's discontinuation step and cleared
      on re-initiation. Sordo 2017 (BMJ): all-cause mortality in the first
      four weeks after leaving treatment vs the rest of time out, rate ratio
      2.38 (methadone) and 2.94 (buprenorphine); Santo 2021 (JAMA Psych):
      6.01 in the first four weeks vs 1.81 thereafter, both against time on
      treatment, i.e. 3.3. The default of 1.0 is inert -- the term has to be
      set by the scenario.
    type: float
    min: 0.0
    max: 20.0

  post_moud_stop_window:
    default: 1
    description: |
      Number of timesteps, counting the step MOUD was stopped on, during
      which `recent_moud_stop` stays True. 1 = the month of stopping only,
      which matches the four-week window the evidence is measured over.
    type: int
    min: 0
    max: 120
