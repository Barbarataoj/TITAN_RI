oud_state:
  # =========================
  # Baseline Initialization
  # =========================
  init_active:
    default: 0.70
    description: |
      Proportion of agents initialized with active OUD at model start.
      Represents individuals with ongoing opioid use.
    type: float
    min: 0.0
    max: 1.0

  init_remission:
    default: 0.30
    description: |
      Proportion of agents initialized in remission from OUD.
      These agents have prior OUD history but are not currently using opioids.
    type: float
    min: 0.0
    max: 1.0

  init_none:
    default: 0.0
    description: |
      Proportion of agents with no OUD history.
      Set to 0.0 to simulate an OUD-only population.
    type: float
    min: 0.0
    max: 1.0

  # =========================
  # OUD Natural History
  # =========================
  transitions:

    # ---------- Incidence ----------
    incidence_rate_per_year:
      default: 0.0
      description: |
        Annual hazard of developing incident OUD among agents with no OUD history.
        Disabled (0.0) for OUD-only simulations.
      type: float
      min: 0.0
      max: 1.0

    # ---------- Remission ----------
    remission_rate_per_year:
      default: 0.15
      description: |
        Annual hazard of transitioning from active OUD to remission.
        This rate may be increased for agents on MOUD.
      type: float
      min: 0.0
      max: 1.0

    # ---------- Relapse ----------
    relapse_rate_per_year:
      default: 0.35
      description: |
        Annual hazard of relapse from remission back to active OUD.
        Represents long-term average relapse risk.
      type: float
      min: 0.0
      max: 5.0

    early_relapse_window_months:
      default: 6.0
      description: |
        Length of "early remission" in MONTHS, during which relapse risk is
        elevated by early_relapse_rr. Converted internally to timesteps using
        model.time.steps_per_year.

        Previously this was early_relapse_window, expressed in raw timesteps with
        a default of 26 chosen for weekly steps. The model runs monthly, so it was
        being read as 26 months (2.2 years): 63.5% of all remission person-steps
        fell inside the "early" window and the realized relapse hazard came out at
        0.458/yr against a configured 0.236/yr, a 1.95x inflation. See
        EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P7.
      type: float
      min: 0.0

    early_relapse_window:
      default: -1
      description: |
        DEPRECATED -- replaced by early_relapse_window_months.

        This was expressed in raw timesteps but defaulted to a weekly-step value
        while the model runs monthly. Setting it now raises rather than silently
        applying a ~4x-too-long elevated-relapse window.
      type: int
      min: -1

    early_relapse_rr:
      default: 2.5
      description: |
        Relative increase in relapse hazard during early remission.
        Applied when time_in_remission is inside early_relapse_window_months.
      type: float
      min: 1.0
      max: 10.0

    relapse_risk_window_months:
      default: 2.0
      description: |
        Length in MONTHS of the elevated-overdose-risk window following relapse
        from remission, reflecting loss of opioid tolerance. Converted internally
        to timesteps using model.time.steps_per_year. ~2 months corresponds to the
        8-week upper end of the usual 4-12 week post-abstinence tolerance-loss
        window.

        Previously this was relapse_risk_window, expressed in raw timesteps with a
        default of 8 chosen for weekly steps (i.e. ~8 weeks). On monthly steps
        that read as 8 months, ~4x too long. oud_state.py's own fallback was
        steps_per_year // 6 (~8 weeks), which disagreed with this default by the
        same factor. See EPIDEMIC_DYNAMICS_MAP_2026-07-29.md finding P7.
      type: float
      min: 0.0

    relapse_risk_window:
      default: -1
      description: |
        DEPRECATED -- replaced by relapse_risk_window_months.

        This was expressed in raw timesteps but defaulted to a weekly-step value
        while the model runs monthly. Setting it now raises rather than silently
        applying a ~4x-too-long tolerance-loss window.
      type: int
      min: -1

    # ---------- Injection dynamics ----------
    inject_start_rate_per_year:
      default: 0.02
      description: |
        Annual hazard of initiating injection drug use among agents
        with active non-injecting OUD.
      type: float
      min: 0.0
      max: 1.0

    inject_stop_rate_per_year:
      default: 0.10
      description: |
        Annual hazard of stopping injection drug use among agents
        with active injecting OUD.
      type: float
      min: 0.0
      max: 1.0

    relapse_to_inj_prob:
      default: 0.5
      description: |
        Probability that relapse from remission returns an agent
        to injecting use, conditional on prior injection history.

        "Prior injection history" means injection within
        inject_relapse_window_years, not ever -- see that parameter.
      type: float
      min: 0.0
      max: 1.0

    inject_relapse_window_years:
      default: 999.0
      description: |
        How recently an agent must have injected to be eligible to relapse from
        remission back to INJECTING rather than to non-injecting use. Measured in
        YEARS against agent.last_injection_time, converted internally to timesteps
        using model.time.steps_per_year.

        WHY THIS EXISTS. Eligibility used to be gated on agent.ever_injected, a
        one-way latch set the first time an agent injects and cleared only by
        death. Nothing else in the model resets it, so an agent who last injected
        forty years ago carried the same relapse-to-injection probability as one
        who injected last month.

        Two measured consequences, both from job 4779604:

          * The injection share of active OUD has no equilibrium below its latched
            ceiling. It rises 0.379 -> 0.491 -> 0.546 -> 0.546 across burn lengths
            60/240/720/1440 and settles at ~0.545, while the calibration target is
            0.45 -- reachable only in transit, somewhere around burn 120-240.
          * On any projection horizon longer than the calibration window the share
            therefore keeps climbing for reasons unrelated to any intervention,
            which contaminates scenario contrasts. The quantity the whole
            intervention analysis is about drifts on its own.

        THE DEFAULT IS DELIBERATELY INERT. 999 years exceeds any run length, so
        every agent who has ever injected stays eligible and behaviour is
        identical to the latch. Existing scenarios, and the calibration in flight
        as of 2026-08-10, are unaffected until the value is set.

        FITTING IT. It is a free parameter with no external anchor, and it has a
        matched objective -- inj_share_err is what it moves -- so it belongs in
        parameters_to_optimize rather than being hardcoded. Note that shortening
        it can only LOWER the equilibrium injection share, never raise it: the
        compartmental replica in analysis/oud_feasibility_2026-07-30/ puts
        equilibrium inj-of-active at 0.562 with the latch and 0.222 at a two-year
        window, on trial 1267's rates. So it has to be fitted jointly with the
        five OUD transition rates, which set the ceiling it works down from.
      type: float
      min: 0.0

    # ---------- MOUD interaction ----------
    moud_remission_rr:
      default: 1.5
      description: |
        Relative increase in remission hazard for agents actively on MOUD.
      type: float
      min: 1.0
      max: 5.0
