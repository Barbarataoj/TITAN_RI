calibration:
  injection:
    act:
      default: 1.0
      description: Scales number of injection acts during syringe-based transmission
      type: float
      min: 0
  sex:
    act:
      default: 1.0
      description: Scales number of sex acts during sex transmission
      type: float
      min: 0
    act_msm:
      default: -1.0
      description: |
        Scales the number of sex acts in partnerships involving an MSM or MSMW
        agent, in place of `act`. -1 (default) means "use `act`". Added
        2026-09-29: the per-act HIV acquisition probability for male-male sex
        is ~12x the heterosexual value, so a single act scalar fitted to the
        heterosexual route overheats the MSM compartment. The calibration
        fixes this at the NSFG-anchored prior (1.0) and fits `act` for the
        heterosexual route only.
      type: float
      min: -1.0
    partner:
      default: 1.0
      description: Scales probability of partner acquisition
      type: float
      min: 0
  background:
    msm_inj_mult:
      default: -1.0
      description: |
        Multiplier on the background (non-OUD partner) sexual act rate for
        MSM/MSMW agents who inject, in place of
        hiv.background_sex.inj_multiplier. -1 (default) means "use
        inj_multiplier". Added 2026-09-29: RIDOH attributes ~71% of HIV
        diagnoses among people who inject to the MSM/IDU category, i.e. mostly
        sexual acquisition from the MSM community by men who also inject; with
        the internal MSM pool held at a plausible prevalence the model cannot
        produce that without a separate outside-exposure term for this group.
        Fitted by the calibration against RIDOH's all-route PWID windows.
      type: float
      min: -1.0
  acquisition:
    default: 1.0
    description: Scales probability of acquisition
    type: float
    min: 0.0
  test_frequency:
    default: 1.0
    description: Scaling factor for testing frequency
    type: float
    min: 0
  mortality:
    default: 1.0
    description: Scaling factor for all cause mortality rates
    type: float
    min: 0
  incarceration:
    default: 1.0
    description: Scaling factor for probability of becoming incarcerated
    type: float
    min: 0
  partnership:
    buffer:
      default: 1.0
      description: Scaling factor for number of partners able to take on when other agents are looking to partner
      type: float
      min: 1.0
    break_point:
      default: 3
      type: int
      description: How many failed attempts an agent can have at partnering in a given round before removing them from the eligible pool
      min: 0
  haart:
    transmission:
      default: 1.0
      description: Scaling factor for effictiveness of ART therapy on transmission probability
      type: float
      min: 0.0
    coverage:
      default: 1.0
      description: Scaling factor for enrollment on ART probability
      type: float
      min: 0.0
  network:
    trim:
      prob:
        default: 0.1
        description: Probability an agent's relationships will be trimmed if using comp_size for network initialization
        type: float
        min: 0
        max: 1
