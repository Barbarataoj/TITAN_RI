prep:
  type:
    default:
      - Oral
    values:
      - Oral
      - Inj
    description: Type of PrEP used in model
    type: array
  cap:
    default: 0.0
    description: Ceiling/target coverage for PrEP coverage, or probability of initiating prep at a timestep if cap_as_prob is true
    type: float
    min: 0
    max: 1
  init:
    default: 0.0
    description: Probability of initiating PrEP at agent creation
    type: float
    min: 0.
    max: 1.
  cap_as_prob:
    default: false
    description: If prep.cap should be treated as a probability instead of a cap
    type: boolean
  start_time:
    default: 0
    description: Timestep at which prep should start in the model
    type: int
  efficacy:
    adherent:
      default: 0.96
      description: Probability of PrEP efficacy if agent is adherent
      type: float
      min: 0
      max: 1
    non_adherent:
      default: 0.76
      description: Probabilty of PrEP efficacy if agent is non-adherent
      type: float
      min: 0
      max: 1
  target_model:
    default:
      - Allcomers
    values:
      - Allcomers
      - cdc_women
      - cdc_msm
      - pwid
      - pwid_sex
      - Racial
      - ssp
      - ssp_sex
    description: which models to use to determine who is enrolled in PrEP
    type: array
  half_life:
    default: 40.0
    description: Half life in days of injectable PrEP, used to calculate agent's prep load
    type: float
    min: 0
  peak_load:
    default: 4.91
    description: Maximum prep load that an agent can have (load at injection time step)
    type: float
    min: 0
  lai:
    prob:
      default: 0
      description: Probability of getting long acting injectable prep
      type: float
      min: 0
      max: 1
  acceptance:
    default: 1.0
    description: |
      Probability that an agent accepts PrEP when a provider offers it. Only used
      when features.care_seeking is enabled, in which case offers replace the cap
      and target_model machinery as the route onto PrEP.
    type: float
    min: 0.0
    max: 1.0
  use_products:
    default: false
    description: |
      Use the per-product PrEP table (`prep.products`) instead of `prep.type` /
      `prep.lai.prob`. Each start draws a product by share_of_starts. Oral keeps
      the adherence / discontinuation path; injectable products follow an
      injection schedule whose persistence is attendance at each due injection.
      2026-10-02.
    type: boolean
  products:
    type: definition
    description: |
      PrEP products. type Oral: daily pill (adherence, discontinue,
      discontinue_late_* as before; product efficacy fields unused). type Inj:
      initiation_injections injections one step apart, then one every
      interval_steps; at each due injection the agent attends with probability
      attendance (scaled by a reached agent's care_seeking
      reach_prep_monitoring_mult); after a miss it returns with probability
      return_prob per step, and stops if the injection is more than
      max_gap_steps late. Protection is `efficacy` while on schedule and decays
      with half-life tail_half_life_steps once the due date has passed. Each
      injection is a care encounter in prep.monitoring_setting with an HIV test
      when test_at_injection. Cabotegravir LA: 2 initiation injections, every
      2 months; lenacapavir: oral loading within the first step plus one
      injection, every 6 months.
      Shares: share_of_starts is the share among starts at time t; -1 makes a
      product take the remainder (1 minus the other products' current
      shares). A product is unavailable before available_from_step, and its
      share moves linearly from share_of_starts to share_end between
      share_ramp_start_step and share_ramp_end_step (-1 = no ramp).
      Protection: efficacy while on schedule (efficacy_injection, when >= 0,
      for injection exposure, where neither injectable has trial data), held
      for tail_full_steps after the due date, then decaying with half-life
      tail_half_life_steps.
    fields:
      type:
        type: enum
        values: [Oral, Inj]
        default: Oral
      share_of_starts:
        type: float
        default: 0.0
        min: -1.0
        max: 1.0
      available_from_step:
        type: int
        default: -9999
      share_ramp_start_step:
        type: int
        default: -1
      share_ramp_end_step:
        type: int
        default: -1
      share_end:
        type: float
        default: 0.0
        min: 0.0
        max: 1.0
      initiation_injections:
        type: int
        default: 1
        min: 1
      interval_steps:
        type: int
        default: 1
        min: 1
      attendance:
        type: float
        default: 1.0
        min: 0.0
        max: 1.0
      return_prob:
        type: float
        default: 0.0
        min: 0.0
        max: 1.0
      max_gap_steps:
        type: int
        default: 0
        min: 0
      efficacy:
        type: float
        default: 0.96
        min: 0.0
        max: 1.0
      efficacy_injection:
        type: float
        default: -1.0
        min: -1.0
        max: 1.0
      tail_full_steps:
        type: int
        default: 0
        min: 0
      tail_half_life_steps:
        type: float
        default: 1.0
        min: 0.0
      test_at_injection:
        type: boolean
        default: true
    default:
      oral:
        type: Oral
        share_of_starts: 1.0
  discontinue_late_after_steps:
    default: 0
    description: |
      Time on PrEP (steps) after which the per-step discontinuation probability
      is multiplied by discontinue_late_mult: persistence curves are
      front-loaded (general 3/6/12-month persistence ~0.78/0.60/0.50, PWID
      ~0.35/0.12/0.05), so the hazard after the first months is lower than the
      early one. 0 = constant hazard. 2026-10-02.
    type: int
    min: 0
  discontinue_late_mult:
    default: 1.0
    description: "Multiplier on the per-step discontinuation probability once time on PrEP reaches discontinue_late_after_steps (0.4 = late hazard 40% of the early one)."
    type: float
    min: 0.0
  monitoring_interval_steps:
    default: 0
    description: |
      Guideline PrEP monitoring: every this many steps after initiation an agent
      on oral PrEP is due a monitoring visit (HIV test plus the visit itself),
      made in prep.monitoring_setting with probability monitoring_attendance.
      The visit counts as a care encounter and carries a guaranteed HIV test
      offer accepted with probability 1. 0 = off. Only with features.care_seeking.
      2026-10-02.
    type: int
    min: 0
  monitoring_attendance:
    default: 1.0
    description: "Probability a due PrEP monitoring visit is attended (a reached agent's care_seeking reach_prep_monitoring_mult scales it)."
    type: float
    min: 0.0
    max: 1.0
  monitoring_setting:
    default: primary_care
    description: "The care_seeking setting in which PrEP monitoring visits take place."
    type: str
