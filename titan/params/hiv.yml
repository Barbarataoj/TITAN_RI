hiv:
  dx:
    prob:
      default: -1.0
      description: "Top-level HIV diagnosis probability at a testing event (calibration override). If < 0, the engine falls back to the per-demographic demographics.<race>.sex_type.<st>.drug_type.<dt>.hiv.dx.prob value."
      type: float
      min: -1.0
      max: 1.0
    risk_reduction:
      sex:
        default: 0
        description: risk reduction in sex transmission probability for diagnosed agents
        type: float
        min: 0
        max: 1
      injection:
        default: 0
        description: risk reduction in sex transmission probability for diagnosed agents
        type: float
        min: 0
        max: 1
  acute:
    infectivity:
      default: 4.3
      description: Infectivity multiplier ratio for acute status infections
      type: float
      min: 0
    duration:
      default: 2
      description: Number of time steps an agent is in acute status
      type: int
      min: 0
  aids:
    prob:
      default: 0.004
      description: Probability of an agent with hiv progressing to aids at a given time step (scaled by haart adherence)
      type: float
      min: 0
      max: 1
  max_init_time:
    default: 42
    description: On creation, agents are randomly assigned an hiv.time, this is the maximum time
    type: int
    min: 2
  start_time:
    default: -999
    description: "What timestep to allow agents to 1) init with HIV or 2) update/progress AIDS"
    type: int
    min: -999

  # NEW: background risk from non-OUD partners (force-of-infection term)
  background_sex:
    rate_nonoud_per_timestep:
      default: 0.0
      description: "Average number of sex acts per model timestep that an OUD agent has with non-OUD partners. Set to 0 to disable background FOI."
      type: float
      min: 0.0
    partner_hiv_prevalence_nonoud:
      default: 0.0
      description: "HIV prevalence among non-OUD sexual partners in the background population (0–1)."
      type: float
      min: 0.0
      max: 1.0
    per_act_transmission_prob:
      default: -1.0
      description: "DEPRECATED 2026-07-30, raises if set (HIV._check_deprecated_background_keys). The per-act probability for background sex is now read from partnership.sex.acquisition[sex_type][sex_role] -- the same table the network route uses, because it is the same biological quantity. As a standalone key it was sex-type-blind and sat in parameters_to_optimize, giving the exogenous route a free lever that competed with the network routes for the PWID incidence target (audit F9)."
      type: float
      min: -1.0
      max: 1.0
    inj_multiplier:
      default: 1.0
      description: "Multiplier on background sexual risk for agents with injecting OUD (drug_type == 'Inj')."
      type: float
      min: 0.0
