demographics:
  type: sub-dict
  description: >
    Population demographic parameters, indexed by race categories.
    IMPORTANT:
      - "race" here may represent a combined race+ethnicity class
        (e.g., white_nonhispanic, white_hispanic, black_nonhispanic).
      - Each race entry must define its own ppl share and nested behaviors.
      - Across all races, ppl values must sum to 1.

  keys:
    - races

  default:

    # -----------------------------------------------------
    #   DEMOGRAPHIC WEIGHT WITHIN POPULATION (REQUIRED)
    # -----------------------------------------------------
    ppl:
      default: 0.0
      description: >
        Proportion of the total population belonging to this race class.
        All race-class ppl values must sum to 1.0.
      type: float
      min: 0.0
      max: 1.0


    # -----------------------------------------------------
    #   DISEASE-SPECIFIC TRANSMISSION SCALING
    # -----------------------------------------------------
    hiv:
      transmission:
        default: 1.0
        description: Scaling factor for HIV transmission probability.
        type: float
        min: 0

    monkeypox:
      transmission:
        default: 1.0
        description: Scaling factor for monkeypox transmission probability.
        type: float
        min: 0


    # -----------------------------------------------------
    #   AGE DISTRIBUTION (RACE-SPECIFIC)
    # -----------------------------------------------------
    age:
      type: bin
      description: >
        Age distribution for this race class. Probabilities must be increasing to 1.
      fields:
        prob:
          type: float
          min: 0
          max: 1
        min:
          type: int
          min: 0
        max:
          type: int
          min: 0
      default:
        1: {prob: 0.085, min: 15, max: 24}
        2: {prob: 0.291, min: 25, max: 34}
        3: {prob: 0.511, min: 35, max: 44}
        4: {prob: 0.960, min: 45, max: 54}
        5: {prob: 1.000, min: 55, max: 80}


    # -----------------------------------------------------
    #   SEX TYPE (RACE-SPECIFIC)
    # -----------------------------------------------------
    sex_type:
      type: sub-dict
      description: >
        Sex-type distribution and behaviors for this race class.
        All sex_type.ppl entries must sum to 1.
      keys:
        - sex_types

      default:
        ppl:
          default: 0.0
          description: >
            Fraction of agents with this sex_type within the race class.
          type: float
          min: 0.0
          max: 1.0

        sex_role:
          init:
            versatile: {default: 1.0, type: float, min: 0.0, max: 1.0}
            insertive: {default: 0.0, type: float, min: 0.0, max: 1.0}
            receptive: {default: 0.0, type: float, min: 0.0, max: 1.0}

        incar:
          init:
            default: 0.0
            type: float
          prob:
            default: 0.0
            type: float
          duration:
            prob:
              type: bin
              fields:
                prob: {type: float}
                min: {type: int}
                max: {type: int}
              default:
                1: {prob: 0.40,  min: 1,   max: 2}
                2: {prob: 0.475, min: 1,   max: 13}
                3: {prob: 0.065, min: 13,  max: 26}
                4: {prob: 0.045, min: 26,  max: 78}
                5: {prob: 0.010, min: 78,  max: 130}
                6: {prob: 0.010, min: 130, max: 260}

            init:
              type: bin
              fields:
                prob: {type: float}
                min: {type: int}
                max: {type: int}
              default:
                1: {prob: 0.14, min: 1,   max: 13}
                2: {prob: 0.09, min: 13,  max: 26}
                3: {prob: 0.20, min: 26,  max: 78}
                4: {prob: 0.11, min: 78,  max: 130}
                5: {prob: 0.16, min: 130, max: 260}
                6: {prob: 0.30, min: 260, max: 520}


        injection:
          num_acts:    {default: 0.0, type: float}
          unsafe_prob: {default: 0.0, type: float, min: 0.0, max: 1.0}

        safe_sex:
          type: sub-dict
          keys: [bond_types]
          default:
            prob: {default: 0.0, type: float, min: 0.0, max: 1.0}

        prep:
          discontinue: {default: 0.0, type: float}
          adherence:   {default: 0.0, type: float}
          cap:         {default: 0.0, type: float}
          init:        {default: 0.0, type: float}

        high_risk:
          init: {default: 0.0, type: float}

        vaccine:
          init: {default: 0.0, type: float}
          prob: {default: 0.0, type: float}
          booster:
            interval: {default: 0, type: int}
            prob:     {default: 0.0, type: float}


        # -----------------------------------------------------
        #   DRUG USE CLASS (per race × sex_type)
        # -----------------------------------------------------
        drug_type:
          type: sub-dict
          keys:
            - drug_types

          default:
            ppl: {default: 0.0, type: float}

            hiv:
              init: {default: 0.0, type: float}
              dx:
                init: {default: 0.0, type: float}
                prob: {default: 0.0, type: float}
              aids:
                init: {default: 0.0, type: float}

            monkeypox:
              init: {default: 0.0, type: float}
              dx:
                init: {default: 0.0, type: float}
                prob: {default: 0.0, type: float}

            haart:
              init:  {default: 0.0, type: float}
              cap:   {default: 0.0, type: float}
              enroll:
                type: definition
                fields:
                  prob:  {type: float}
                  start: {type: int}
                  stop:  {type: int}
                default:
                  enroll_0: {start: 0, stop: 999, prob: 0.0}
              reinit:
                prob: {default: 0.0, type: float}
              adherence:
                init:        {default: 0.0, type: float}
                prob:        {default: 0.0, type: float}
                discontinue: {default: 0.0, type: float}
                become:      {default: 0.0, type: float}
              discontinue: {default: 0.0, type: float}

            prep:
              # Drug-type-level PrEP persistence (2026-10-02): when >= 0 these
              # override the sex-type-level prep.discontinue / prep.adherence for
              # agents of this drug type (people who inject stop ~2.5x faster).
              # -1 = not set, use the sex-type level.
              discontinue: {default: -1.0, type: float}
              adherence:   {default: -1.0, type: float}

            moud:
              # Non-zero defaults so MOUD can initiate even when scenario YAML
              # doesn't override per-demographic values. Calibration targets a
              # ~40% MOUD coverage among OUD-active (see calibration_targets.yml).
              init:        {default: 0.30, type: float}    # baseline P(on MOUD at t=0 | OUD)
              discontinue: {default: 0.078, type: float}   # per-month dropout (Hallowell 2023, 37.8% 12-mo retention)
              enroll:
                type: definition
                fields:
                  prob:  {type: float}
                  start: {type: int}
                  stop:  {type: int}
                default:
                  enroll_0: {start: 0, stop: 999, prob: 0.05}   # per-month MOUD initiation hazard
              reinit:
                prob: {default: 0.10, type: float}         # per-month re-init prob after dropout

            exit:
              type: sub-dict
              keys: [exit]
              default:
                prob: {default: 0.0, type: float}
                base: {default: 10.8, type: float}
                hiv:  {default: 2.0, type: float}
                aids: {default: 4.0, type: float}
                haart_adherent: {default: 1.0, type: float}

            num_partners:
              type: sub-dict
              keys: [bond_types]
              default:
                dist_type: {default: set_value, type: enum, class: distributions}
                vars:
                  type: bin
                  fields:
                    value:      {type: float}
                    value_type: {type: enum, values: [int, float]}
                  default:
                    1: {value: 0, value_type: int}
