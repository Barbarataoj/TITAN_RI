  sex:
    acquisition:
      MSM:
        insertive: 0.005
        receptive: 0.015
        versatile: 0.01
    # Monthly sex acts per partnership. MUST be stated explicitly: the shipped
    # default is a single bin of min:0/max:1 and utils.safe_random_int is
    # half-open, so that default yields zero acts forever and silently disables
    # sexual HIV transmission entirely. Every RI parameter file omitted this
    # block and so ran injection-only -- see EPIDEMIC_DYNAMICS_MAP_2026-07-29.md
    # finding P1. HIV.init_class now raises rather than let that pass quietly.
    #
    # 4.0 acts/month is an NSFG-anchored prior for partnered adults. No
    # RI-specific PWID/OUD coital-frequency data exists, so the LEVEL is not
    # pinned here -- it is fitted through the calibration.sex.act scalar
    # (parameters_to_optimize) against the HIV prevalence and incidence targets.
    # Keep Sex and SexInj equal unless there is data to separate them; one
    # shared scalar keeps the search space at one dimension.
    frequency:
      Sex:
        type: distribution
        distribution:
          dist_type: poisson
          vars:
            1:
              value: 4.0
              value_type: float
      SexInj:
        type: distribution
        distribution:
          dist_type: poisson
          vars:
            1:
              value: 4.0
              value_type: float
